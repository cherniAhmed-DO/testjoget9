                  \ status\r\n        updatePstmt.setString(2, id_enquete);      \
                  \       // Update enquete ID\r\n        updatePstmt.setString(3,\
                  \ identmen);     // Update with desired id_menage\r\n        updatePstmt.setString(4,counter_abs_s);\
                  \                 // Where clause based on NPI\r\n        updatePstmt.setString(5,\
                  \ npi_inexistant);                 // Where clause based on NPI\r\
                  \n        // Execute update\r\n        int rowsUpdated = updatePstmt.executeUpdate();\r\
                  \n        LogUtil.info(\"Updated rows for NPI \" + npi + \": \"\
                  , String.valueOf(rowsUpdated));\r\n    }\r\n    updatePstmtEnquete.setString(1,status);\r\
                  \n    updatePstmtEnquete.setString(2,npi_inexistant);\r\n    \r\n\
                  \    updatePstmt.close();\r\n    LogUtil.info(\"Updates completed\
                  \ successfully.\", \"\");\r\n\r\n} catch (SQLException e) {\r\n\
                  \    LogUtil.error(\"Beanshell\", e, \"SQL Exception occurred.\"\
                  );\r\n} finally {\r\n    // Close the resources\r\n    try {\r\n\
                  \        if (con != null) con.close();\r\n    } catch (SQLException\
                  \ e) {\r\n        LogUtil.error(\"Beanshell\", e, \"Error closing\
                  \ resources.\");\r\n    }\r\n}\r\n"
