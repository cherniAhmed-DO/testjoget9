                  \ {\r\n            try {\r\n                dossierOrg= Integer.parseInt(rs2.getString(1));\r\
                  \n                dosserAnps = Integer.parseInt(rs2.getString(2));\r\
                  \n            }catch(Exception e){\r\n                Logutil.error(\"\
