            org.joget.directory.model.service.ExtDirectoryManager;\r\nimport org.joget.workflow.model.WorkflowActivity;\r\nimport
            java.sql.Connection;\r\nimport java.sql.PreparedStatement;\r\nimport java.sql.ResultSet;\r\nimport
            java.sql.SQLException;\r\nimport javax.sql.DataSource;\r\nimport org.joget.commons.util.LogUtil;\r\nimport
            java.lang.String;\r\npublic Collection getAssignees(WorkflowActivity activity)
            {\r\n    Connection con =null;\r\n    String compagne_enquete=\"#form.pmt.compagne_enquete#\";\r\n    LogUtil.info(\"---compagne_enquete
            id ------\",compagne_enquete);\r\n    Collection assignees = new ArrayList();\r\n    ExtDirectoryManager
            directoryManager = (ExtDirectoryManager) pluginManager.getBean(\"directoryManager\");\r\n    //Get
            users using directory manager\r\n    try{\r\n        Connection con=null;\r\n        DataSource
            ds = (DataSource) AppUtil.getApplicationContext().getBean(\"setupDataSource\");\r\n        con
            = ds.getConnection();\r\n        String query=\" SELECT c_chef_equipe
            from app_fd_planif_enquete where c_compagne_enquete=?\";\r\n        PreparedStatement
            pstmt = con.prepareStatement(query);\r\n        pstmt.setString(1,compagne_enquete);\r\n        ResultSet
            rs= pstmt.executeQuery();\r\n        String id=\"\";\r\n        if(rs.next()){\r\n            String
            id= rs.getString(\"c_chef_equipe\");\r\n            LogUtil.info(\"chef
            id-----\",id);\r\n            assignees.add(id);\r\n        }else{\r\n            LogUtil.info(\"chef
            inesxistant -----\",rs.getString(\"c_chef_equipe\"));\r\n        }\r\n        \r\n        \r\n        \r\n    }catch
            (SQLException e) {\r\n            LogUtil.error(\"Beanshell\", e, \"SQL
            Exception occurred during insert.\");\r\n    } finally {\r\n            //
            Close the resources\r\n            try {\r\n                if (con !=
            null) con.close();\r\n            } catch (SQLException e) {\r\n                LogUtil.error(\"Beanshell\",
            e, \"Error closing resources.\");\r\n            }\r\n    }\r\n    return
            assignees;\r\n}\r\n//call getAssignees method with injected variable\r\nreturn
            getAssignees(workflowActivity);"}'
