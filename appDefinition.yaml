                  \n                 \r\n \r\n                WorkflowManager wm =\
                  \ (WorkflowManager) pluginManager.getBean(\"workflowManager\");\r\
                  \n                wm.activityVariable(workflowAssignment.getActivityId(),\"\
                  nom\", lastName);\r\n                wm.activityVariable(workflowAssignment.getActivityId(),\"\
                  prenom\", firstName);\r\n                // wm.activityVariable(workflowAssignment.getActivityId(),\"\
