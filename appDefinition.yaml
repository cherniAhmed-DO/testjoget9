            - className: org.joget.apps.app.lib.BeanShellTool
              properties:
                script: "import java.util.ArrayList;\r\nimport java.util.Collection;\r\
                  \nimport org.joget.apps.app.service.AppUtil;\r\nimport org.joget.commons.util.LogUtil;\r\
                  \nimport java.sql.Connection;\r\nimport java.sql.PreparedStatement;\r\
                  \nimport java.sql.ResultSet;\r\nimport java.sql.SQLException;\r\n\
                  import javax.sql.DataSource;\r\nimport java.lang.String;\r\n\r\n\
                  // Database connection\r\nConnection con = null;\r\n\r\n// Get enquete\
                  \ ID\r\nString id_enquete=\"#form.pmt.id_enquete#\";\r\nString enquete\
                  \ = \"#form.pmt.id#\";\r\nString identmen = \"#form.pmt.identmen#\"\
                  ;\r\nLogUtil.info(\"---enquete id ------\", enquete);\r\nLogUtil.info(\"\
                  ---menage id ------\", identmen);\r\n\r\n\r\n// Collection to store\
                  \ NPIs of selected members\r\nCollection membres = new ArrayList();\r\
                  \n\r\ntry {\r\n    // Get DataSource and Connection\r\n    DataSource\
                  \ ds = (DataSource) AppUtil.getApplicationContext().getBean(\"setupDataSource\"\
                  );\r\n    con = ds.getConnection();\r\n\r\n    // First query to\
                  \ select NPIs of members in the survey\r\n    String selectQuery\
                  \ = \"SELECT c_numero_npi FROM app_fd_table_individus WHERE c_id_enquete\
                  \ = ?\";\r\n    PreparedStatement selectPstmt = con.prepareStatement(selectQuery);\r\
                  \n    selectPstmt.setString(1, enquete);\r\n    ResultSet rs = selectPstmt.executeQuery();\r\
                  \n    LogUtil.warn(\"completed executing select query\",\"!!!!!!!!!!\"\
                  );\r\n    // Store NPIs in the collection\r\n    while (rs.next())\
                  \ {\r\n        String npi = rs.getString(\"c_numero_npi\");\r\n\
                  \        LogUtil.info(\"npi------------>\", npi);\r\n        membres.add(npi);\r\
                  \n    }\r\n    LogUtil.warn(\"completed treating rs\",\"-!!!!!!!\"\
                  );\r\n    rs.close();\r\n    selectPstmt.close();\r\n    \r\n\r\n\
                  \    // Update query for the demandes in app_fd_d_preinscription\
                  \ based on selected NPIs\r\n    String updateQuery = \"UPDATE app_fd_d_preinscription\
                  \ SET c_statut_demande = ? , c_id_enquete = ? , c_identmen = ? WHERE\
                  \ c_npi = ?\";\r\n    PreparedStatement updatePstmt = con.prepareStatement(updateQuery);\r\
                  \n\r\n    // Loop through each member and execute the update\r\n\
                  \    for (String npi : membres) {\r\n        // Set parameters for\
                  \ the update (replace \"new_status\", \"new_id_enquete\", \"new_id_menage\"\
                  \ with actual values)\r\n        updatePstmt.setString(1, \"Vers\
                  \ validation communautaire\");        // Update with desired status\r\
                  \n        updatePstmt.setString(2, id_enquete);             // Update\
                  \ enquete ID\r\n        updatePstmt.setString(3, identmen);    \
                  \ // Update with desired id_menage\r\n        updatePstmt.setString(4,\
                  \ npi);                 // Where clause based on NPI\r\n\r\n   \
                  \     // Execute update\r\n        int rowsUpdated = updatePstmt.executeUpdate();\r\
                  \n        LogUtil.info(\"Updated rows for NPI \" + npi + \": \"\
                  , String.valueOf(rowsUpdated));\r\n    }\r\n    \r\n    updatePstmt.close();\r\
                  \n    LogUtil.info(\"Updates completed successfully.\", \"\");\r\
                  \n\r\n} catch (SQLException e) {\r\n    LogUtil.error(\"Beanshell\"\
                  , e, \"SQL Exception occurred.\");\r\n} finally {\r\n    // Close\
                  \ the resources\r\n    try {\r\n        if (con != null) con.close();\r\
                  \n    } catch (SQLException e) {\r\n        LogUtil.error(\"Beanshell\"\
                  , e, \"Error closing resources.\");\r\n    }\r\n}\r\n"
            - className: org.joget.apps.app.lib.DatabaseUpdateTool
