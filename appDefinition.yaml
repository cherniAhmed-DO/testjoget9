                  \nString querySql = \"SELECT COUNT(*) FILTER (WHERE c_tovalidate\
                  \ = 'oui' AND c_id_demande_organisme = ?) AS countInitial, COUNT(*)\
                  \ FILTER (WHERE c_tovalidate = 'oui' AND c_id_demande_organisme\
                  \ = ? AND c_traiter_anps = 'oui') AS countAnps FROM app_fd_indiv_org;\"\
                  ;\r\n\r\n\r\nConnection con = null;\r\ntry {\r\n    // retrieve\
