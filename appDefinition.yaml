                  \ \r\n //Get record Id from process\r\nAppService appService = (AppService)\
                  \ AppUtil.getApplicationContext().getBean(\"appService\");\r\nString\
                  \ recordid = appService.getOriginProcessId(workflowAssignment.getProcessId());\r\
                  \nLogUtil.warn(\"record id\",recordid);\r\n\r\n// Database connection\r\
                  \nConnection con = null;\r\n\r\n// Get enquete ID\r\nString id_enquete=\"\
                  #form.pmt.id_enquete#\";\r\nString enquete =recordid;\r\nString\
                  \ identmen = \"#form.pmt.identmen#\";\r\nString npi_inexistant =\
                  \ \"#form.pmt.npi_inexistant#\";\r\nLogUtil.info(\"---enquete id\
                  \ ------\", enquete);\r\nLogUtil.info(\"---menage id ------\", identmen);\r\
                  \nLogUtil.info(\"---npi_inexistant id ------\", npi_inexistant);\r\
                  \n\r\n\r\n// Collection to store NPIs of selected members\r\nCollection\
                  \ membres = new ArrayList();\r\n\r\ntry {\r\n    // Get DataSource\
                  \ and Connection\r\n    DataSource ds = (DataSource) AppUtil.getApplicationContext().getBean(\"\
                  setupDataSource\");\r\n    con = ds.getConnection();\r\n    String\
                  \ npi=\"\";\r\n    String count_menage=\"\";\r\n   \r\n    // First\
                  \ query to select NPIs of members in the survey\r\n    String selectQuery\
                  \ = \"SELECT c_numero_npi FROM app_fd_table_individus WHERE c_id_enquete\
                  \ = ?\";\r\n    PreparedStatement selectPstmt = con.prepareStatement(selectQuery);\r\
                  \n    selectPstmt.setString(1, enquete);\r\n    ResultSet rs = selectPstmt.executeQuery();\r\
                  \n    LogUtil.warn(\"completed executing select query\",\"!!!!!!!!!!\"\
                  );\r\n    // Store NPIs in the collection\r\n    while (rs.next())\
                  \ {\r\n        npi = rs.getString(\"c_numero_npi\");\r\n       \
                  \ LogUtil.info(\"npi------------>\", npi);\r\n        membres.add(npi);\r\
                  \n    }\r\n    LogUtil.warn(\"completed treating rs\",\"-!!!!!!!\"\
                  );\r\n    rs.close();\r\n    selectPstmt.close();\r\n    membres.add(npi_inexistant);\r\
                  \n    //select inexistant count \r\n    String selectQuery2 = \"\
                  SELECT c_menage_inexistant_counter FROM app_fd_d_preinscription\
                  \ WHERE c_npi = ?\";\r\n    PreparedStatement selectPstmt2 = con.prepareStatement(selectQuery2);\r\
                  \n    selectPstmt2.setString(1, npi_inexistant);\r\n    ResultSet\
                  \ rs2 = selectPstmt2.executeQuery();\r\n    while (rs2.next()) {\r\
                  \n         count_menage = rs2.getString(\"c_menage_inexistant_counter\"\
                  );\r\n        LogUtil.info(\"menage inexistant------------>\", count_menage);\r\
                  \n    }\r\n    LogUtil.warn(\"completed treating rs2\",\"-!!!!!!!\"\
                  );\r\n    rs2.close();\r\n    selectPstmt2.close();\r\n    // Update\
                  \ query for the demandes in app_fd_d_preinscription based on selected\
                  \ NPIs\r\n    int count_abs=Integer.parseInt(count_menage);\r\n\
                  \    // count_menage.isEmpty() || count_menage.isNull()? 0 : Integer.parseInt(count_menage);\r\
                  \n    // if (count_menage != null && !count_menage.isEmpty()) {\r\
                  \n    //     count_abs = Integer.parseInt(count_menage);\r\n   \
                  \ // }\r\n    \r\n    \r\n    String updateQuery = \"UPDATE app_fd_d_preinscription\
                  \ SET c_statut_demande = ?, c_id_enquete = ?, c_identmen = ?, c_menage_inexistant_counter=?\
                  \ WHERE c_npi = ?\";\r\n    String updateQueryEnquete=\"UPDATE app_fd_pmt\
                  \ set c_statut_enquete=? where c_npi_inexistant=?\";\r\n    PreparedStatement\
                  \ updatePstmt = con.prepareStatement(updateQuery);\r\n    PreparedStatement\
                  \ updatePstmtEnquete = con.prepareStatement(updateQueryEnquete);\r\
                  \n    String status=\"\";\r\n    if(count_abs==2){\r\n        status=\"\
                  Demande clôturée\";\r\n    }else{\r\n       status=\"A réenquêter\"\
                  ;\r\n    }\r\n            LogUtil.warn(\"menage status------------>\"\
                  , status);\r\n    // Loop through each member and execute the update\r\
                  \n    // ++count_abs;\r\n    int count_abs2=count_abs+1;\r\n\r\n\
                  \    String counter_abs_s=count_abs2.toString();\r\n    LogUtil.warn(\"\
                  menage cpunter-------------------------------------------------------->\"\
                  , counter_abs_s);\r\n    for (String npi : membres) {\r\n      \
                  \  // Set parameters for the update (replace \"new_status\", \"\
                  new_id_enquete\", \"new_id_menage\" with actual values)\r\n    \
