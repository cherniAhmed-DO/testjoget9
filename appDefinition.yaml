                  \nimport java.io.OutputStream;\r\nimport java.net.HttpURLConnection;\r\
                  \nimport java.net.MalformedURLException;\r\nimport java.net.URL;\r\
                  \nimport org.json.JSONObject;\r\nimport org.json.JSONArray;\r\n\
                  import org.joget.commons.util.UuidGenerator;\r\nimport java.sql.Connection;\r\
                  \nimport java.sql.PreparedStatement;\r\nimport java.sql.ResultSet;\r\
                  \nimport java.sql.SQLException;\r\nimport javax.sql.DataSource;\r\
                  \nimport org.joget.apps.app.service.AppUtil;\r\nimport org.joget.workflow.model.WorkflowProcessResult;\r\
                  \nimport org.joget.workflow.model.service.*;\r\nimport org.joget.directory.model.Department;\r\
                  \n \r\nimport java.util.Collection;\r\nimport org.joget.apps.app.service.AppUtil;\r\
                  \nimport org.joget.directory.model.User;\r\nimport org.joget.directory.model.service.ExtDirectoryManager;\r\
                  \nimport org.joget.workflow.shark.model.dao.WorkflowAssignmentDao;\r\
                  \nimport java.util.Map;\r\nimport org.joget.commons.util.LogUtil;\r\
                  \nimport java.lang.StringBuilder;\r\n \r\n \r\nimport org.joget.apps.app.model.AppDefinition;\r\
                  \nimport org.joget.apps.app.service.AppService;\r\nimport org.joget.apps.app.service.AppUtil;\r\
                  \nimport org.joget.apps.form.model.FormRowSet;\r\nimport org.joget.apps.form.model.FormRow;\r\
                  \n \r\nimport java.util.concurrent.atomic.AtomicInteger;\r\nimport\
                  \ java.util.Calendar;\r\n \r\nimport java.sql.*;\r\n\r\n\r\n \r\n\
                  \ \r\nLogUtil.info(\"-----> ************** in script generation\
                  \ quittance reclamation ***********************\",\"\");\r\n\r\n\
                  \r\n \r\n// Environnement developpemnt\r\nprivate String lien =\
                  \ \"#envVariable.api_gen_url#\";\r\n \r\nLogUtil.info(\"-----> **************\
                  \ lien ***********************\",lien);\r\n \r\nprivate HttpURLConnection\
                  \ connHTTP;\r\nprivate BufferedReader reader;\r\nString line;\r\n\
                  StringBuilder responseContent = new StringBuilder();\r\n//Get record\
                  \ Id from process\r\nAppService appService = (AppService) AppUtil.getApplicationContext().getBean(\"\
                  appService\");\r\nString recordid = appService.getOriginProcessId(workflowAssignment.getProcessId());\r\
                  \n \r\nLogUtil.info(\"------------RecordID---reclamation ------------->\"\
                  , recordid);\r\n\r\npublic void HitApi(String lien,JSONObject jsonData){\r\
                  \n    \r\n \r\ntry {\r\n    URL url = new URL(lien);\r\n    connHTTP\
                  \ = (HttpURLConnection) url.openConnection();\r\n \r\n     LogUtil.info(\"\
                  ---------------------------->7\", \"\");\r\n \r\n \r\n    // Request\
                  \ setup\r\n    connHTTP.setRequestMethod(\"POST\");\r\n    connHTTP.setRequestProperty(\"\
                  Content-Type\", \"application/json;charset=UTF-8\");\r\n    connHTTP.setRequestProperty(\"\
                  Accept\", \"application/json\");\r\n    connHTTP.setDoOutput(true);\r\
                  \n \r\n \r\n    OutputStream os = connHTTP.getOutputStream();\r\n\
                  \    byte[] input = jsonData.toString().getBytes(\"utf-8\");\r\n\
                  \    os.write(input, 0, input.length);\r\n \r\n \r\n    // The response\
                  \ from the server\r\n    int status = connHTTP.getResponseCode();\r\
                  \n\r\n      LogUtil.info(\"----->  json data  \", jsonData.toString());\r\
                  \n\r\n \r\n    LogUtil.info(\"response code \", String.valueOf(status));\r\
                  \n \r\n \r\n    if (status >= 300) {\r\n        reader = new BufferedReader(new\
                  \ InputStreamReader(connHTTP.getErrorStream()));\r\n        while\
                  \ ((line = reader.readLine()) != null) {\r\n            responseContent.append(line);\r\
                  \n        }\r\n        reader.close();\r\n    } else {\r\n     \
                  \   reader = new BufferedReader(new InputStreamReader(connHTTP.getInputStream()));\r\
                  \n        while ((line = reader.readLine()) != null) {\r\n     \
                  \       responseContent.append(line);\r\n        }\r\n        reader.close();\r\
                  \n    }\r\n} catch (Exception e) {\r\n    LogUtil.error(\"CaseVioo\"\
                  , e, \"Error in script Generation fiche cv  post CaseVioo Ouverture\"\
                  );\r\n} finally {\r\n    connHTTP.disconnect();\r\n}\r\n \r\n\r\n\
                  }\r\n//function hit API \r\n \r\n \r\n \r\n \r\nString source_path\
                  \ = \"#envVariable.pathSourceReclamation#\";// ---------------------------------------------------------------------------------------------------------------------------------\r\
                  \nString output_path = \"#envVariable.gen_path#\";//------------------------------------------------------------------------------\r\
                  \nString output_file_name = \"\";\r\nString output_file_name2 =\
                  \ \"\";\r\n\r\nJSONObject jsonData = new JSONObject();\r\njsonData.put(\"\
                  source_path\", source_path);\r\nJSONObject data = new JSONObject();\r\
                  \n\r\ntry {\r\n    Connection con = null;\r\n    DataSource ds =\
                  \ (DataSource) AppUtil.getApplicationContext().getBean(\"setupDataSource\"\
                  );\r\n    con = ds.getConnection();\r\n    \r\n        String catOpyional=\"\
                  du statut actuel « #variable.cat1# » pour le STATUT SOUHAITE « #variable.cat2#\
                  \ »\";\r\n        if (\"#variable.type#\".equals(\"demande_reclassement\"\
                  )){\r\n            data.put(\"type_opt\",catOpyional);\r\n     \
                  \   }\r\n        data.put(\"tel\", \"#variable.tel#\");\r\n    \
                  \    String type=\"#variable.type#\";\r\n        if (\"demande_reclassement\"\
                  .equals(type)) \r\n        data.put(\"type\", \"Demande de reclassement\"\
                  );\r\n        else if (\"demande_enquete_urgente\".equals(type))\
                  \ \r\n            data.put(\"type\", \"Demande d'enquête urgente\"\
                  );\r\n        else if (\"demande _maj\".equals(type)) \r\n     \
                  \       data.put(\"type\", \"Demande de mise à jour\");\r\n    \
                  \    else if (\"plainte_qualite_service\".equals(type)) \r\n   \
                  \         data.put(\"type\", \"Plainte sur la qualité de service\"\
                  );\r\n        else if (\"reclamation_anomalie_plateforme\".equals(type))\
                  \ \r\n            data.put(\"type\", \"Réclamation sur une anomalie\
                  \ de la plateforme\");\r\n        else if (\"demande_revue_decision_radiation\"\
                  .equals(type)) \r\n            data.put(\"type\", \"Demande de revue\
                  \ sur une décision de radiation\");\r\n        else if (\"autres_plaintes\"\
                  .equals(type)) \r\n            data.put(\"type\", \"Autres plaintes\
                  \ (la mentionner)\");\r\n\r\n        \r\n        data.put(\"benificaire\"\
                  ,\"#variable.nom#\"+\" \"+\"#variable.prenom#\");\r\n        data.put(\"\
                  delai\",\"#variable.delai#\");       \r\n        data.put(\"num\"\
                  ,\"#variable.num#\");     \r\n        // ----------------------------------\r\
                  \n        output_file_name = \"quittance_reclamation.docx\";\r\n\
                  \        output_file_name2 = \"quittance_reclamation.pdf\";\r\n\
                  String selectMembers = \"select TO_CHAR(datecreated, 'DD-MM-YYYY')\
                  \ as date,d.firstname,d.lastname from app_fd_demande_reclamation\
                  \ r join dir_user d on (r.createdby=d.id) where r.id=? ;\";\r\n\
                  stmt = con.prepareStatement(selectMembers);\r\nstmt.setString(1,\
                  \ recordid);\r\nrs = stmt.executeQuery();\r\nJSONArray MembreArray\
                  \ = new JSONArray();\r\nwhile (rs.next()) {\r\n    data.put(\"date\"\
                  ,rs.getString(\"date\"));\r\n    data.put(\"demandeur\",rs.getString(\"\
                  firstname\")+\" \"+rs.getString(\"lastname\"));\r\n        }\r\n\
                  \      \r\nLogUtil.info(\"------------data------------->\", data.toString());\r\
                  \njsonData.put(\"data\", data);\r\njsonData.put(\"output_path\"\
                  , output_path+\"/demande_reclamation/\"+recordid);\r\njsonData.put(\"\
                  output_file_name\", output_file_name);\r\nLogUtil.info(\"---------------------------->\"\
                  , jsonData.toString());\r\n//UPDATE FILE COMMISSON\r\n// commissionFileDocRecordID---Commission\r\
                  \nString UpdateFile = \"update app_fd_demande_reclamation set c_quittance_reclamation=?\
                  \ where id=? ;\";\r\nstmtUpdateFileName = con.prepareStatement(UpdateFile);\r\
                  \nstmtUpdateFileName.setString(1, output_file_name2);\r\nstmtUpdateFileName.setString(2,\
                  \ recordid);\r\n\r\nstmtUpdateFileName.executeUpdate();\r\n//UPDATE\
                  \ FILE COMMISSON\r\n\r\n\r\nHitApi(lien,jsonData);\r\n\r\n    rs.close();\r\
                  \n    stmt.close();\r\n    con.close();\r\n} catch (SQLException\
                  \ e) {\r\n    LogUtil.error(\"RSU\", e, \"Error executing SQL query\"\
                  );\r\n} catch (Exception ex) {\r\n    LogUtil.error(\"RSU\", ex,\
                  \ \"Error in script generation pv commission\");\r\n}"
