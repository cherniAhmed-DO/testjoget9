            tools:
            - className: org.joget.apps.app.lib.BeanShellTool
              properties:
                script: "//doc pv commission RSU\r\nimport java.io.BufferedReader;\r\
                  \nimport java.io.IOException;\r\nimport java.io.InputStreamReader;\r\
                  \nimport java.io.OutputStream;\r\nimport java.net.HttpURLConnection;\r\
                  \nimport java.net.MalformedURLException;\r\nimport java.net.URL;\r\
                  \nimport org.json.JSONObject;\r\nimport org.json.JSONArray;\r\n\
                  import org.joget.commons.util.UuidGenerator;\r\nimport java.sql.Connection;\r\
                  \nimport java.sql.PreparedStatement;\r\nimport java.sql.ResultSet;\r\
                  \nimport java.sql.SQLException;\r\nimport javax.sql.DataSource;\r\
                  \nimport org.joget.apps.app.service.AppUtil;\r\nimport org.joget.workflow.model.WorkflowProcessResult;\r\
                  \nimport org.joget.workflow.model.service.*;\r\nimport org.joget.directory.model.Department;\r\
                  \n \r\nimport java.util.Collection;\r\nimport org.joget.apps.app.service.AppUtil;\r\
                  \nimport org.joget.directory.model.User;\r\nimport org.joget.directory.model.service.ExtDirectoryManager;\r\
                  \nimport org.joget.workflow.shark.model.dao.WorkflowAssignmentDao;\r\
                  \nimport java.util.Map;\r\nimport org.joget.commons.util.LogUtil;\r\
                  \nimport java.lang.StringBuilder;\r\n \r\n \r\nimport org.joget.apps.app.model.AppDefinition;\r\
                  \nimport org.joget.apps.app.service.AppService;\r\nimport org.joget.apps.app.service.AppUtil;\r\
                  \nimport org.joget.apps.form.model.FormRowSet;\r\nimport org.joget.apps.form.model.FormRow;\r\
                  \n \r\nimport java.util.concurrent.atomic.AtomicInteger;\r\nimport\
                  \ java.util.Calendar;\r\n \r\nimport java.sql.*;\r\n//--------date\
                  \ \r\nimport java.time.LocalDateTime;\r\nimport java.time.format.DateTimeFormatter;\r\
                  \n//-----------deate\r\n \r\nCalendar calendar = Calendar.getInstance();\r\
                  \nint currentYear = calendar.get(Calendar.YEAR);\r\nint nextYear\
                  \ = currentYear + 1;\r\n \r\nString currentYearString = String.valueOf(currentYear);\r\
                  \nString nextYearString = String.valueOf(nextYear);\r\n \r\n// Now\
                  \ you can use the 'currentYearString' and 'nextYearString' variables\r\
                  \n \r\n \r\n \r\nLogUtil.info(\"-----> ************** in script\
                  \ generation PV commission ***********************\",\"\");\r\n\r\
                  \n\r\n \r\n// Environnement developpemnt\r\nprivate String lien\
                  \ = \"#envVariable.api_gen_url#\";\r\n \r\nLogUtil.info(\"----->\
                  \ ************** lien ***********************\",lien);\r\n \r\n\
                  private HttpURLConnection connHTTP;\r\nprivate BufferedReader reader;\r\
                  \nString line;\r\nStringBuilder responseContent = new StringBuilder();\r\
                  \n//Get record Id from process\r\nAppService appService = (AppService)\
                  \ AppUtil.getApplicationContext().getBean(\"appService\");\r\nString\
                  \ recordid = appService.getOriginProcessId(workflowAssignment.getProcessId());\r\
                  \n// String recordid = \"040f5128-0cf8-4b2c-98af-8f593978a6ae\"\
                  ;\r\n \r\nLogUtil.info(\"------------RecordID---Commission ------------->\"\
                  , recordid);\r\n\r\npublic void HitApi(String lien,JSONObject jsonData){\r\
                  \n    \r\n \r\ntry {\r\n    URL url = new URL(lien);\r\n    connHTTP\
                  \ = (HttpURLConnection) url.openConnection();\r\n \r\n     LogUtil.info(\"\
                  ---------------------------->7\", \"\");\r\n \r\n \r\n    // Request\
                  \ setup\r\n    connHTTP.setRequestMethod(\"POST\");\r\n    connHTTP.setRequestProperty(\"\
                  Content-Type\", \"application/json;charset=UTF-8\");\r\n    connHTTP.setRequestProperty(\"\
                  Accept\", \"application/json\");\r\n    connHTTP.setDoOutput(true);\r\
                  \n \r\n \r\n    OutputStream os = connHTTP.getOutputStream();\r\n\
                  \    byte[] input = jsonData.toString().getBytes(\"utf-8\");\r\n\
                  \    os.write(input, 0, input.length);\r\n \r\n \r\n    // The response\
                  \ from the server\r\n    int status = connHTTP.getResponseCode();\r\
                  \n\r\n      LogUtil.info(\"----->  json data  \", jsonData.toString());\r\
                  \n\r\n \r\n    LogUtil.info(\"response code \", String.valueOf(status));\r\
                  \n \r\n \r\n    if (status >= 300) {\r\n        reader = new BufferedReader(new\
                  \ InputStreamReader(connHTTP.getErrorStream()));\r\n        while\
                  \ ((line = reader.readLine()) != null) {\r\n            responseContent.append(line);\r\
                  \n        }\r\n        reader.close();\r\n    } else {\r\n     \
                  \   reader = new BufferedReader(new InputStreamReader(connHTTP.getInputStream()));\r\
                  \n        while ((line = reader.readLine()) != null) {\r\n     \
                  \       responseContent.append(line);\r\n        }\r\n        reader.close();\r\
                  \n    }\r\n} catch (Exception e) {\r\n    LogUtil.error(\"CaseVioo\"\
                  , e, \"Error in script Generation fiche cv  post CaseVioo Ouverture\"\
                  );\r\n} finally {\r\n    connHTTP.disconnect();\r\n}\r\n \r\n\r\n\
                  }\r\n//function hit API \r\n \r\n \r\n \r\n \r\nString source_path\
                  \ = \"#envVariable.pathSourceCommission#\";// ---------------------------------------------------------------------------------------------------------------------------------\r\
                  \nString output_path = \"#envVariable.gen_path#\";//------------------------------------------------------------------------------\r\
                  \nString output_file_name = \"\";\r\nString output_file_name2 =\
                  \ \"\";\r\n\r\nJSONObject jsonData = new JSONObject();\r\njsonData.put(\"\
                  source_path\", source_path);\r\nJSONObject data = new JSONObject();\r\
                  \n\r\ntry {\r\n    Connection con = null;\r\n    DataSource ds =\
                  \ (DataSource) AppUtil.getApplicationContext().getBean(\"setupDataSource\"\
                  );\r\n    con = ds.getConnection();\r\n   \r\n        String commission_president\
                  \ = \"#variable.president#\";\r\n        // String commission_president\
                  \ = \"06/12/2024 15:00\";\r\n\r\n\r\n        //get date ---------------\r\
                  \n        DateTimeFormatter dtf = DateTimeFormatter.ofPattern(\"\
                  yyyy-MM-dd hh:mm a\");\r\n        DateTimeFormatter newDateFormat\
                  \ = DateTimeFormatter.ofPattern(\"dd/MM\");\r\n        DateTimeFormatter\
                  \ newDateFormatYear = DateTimeFormatter.ofPattern(\"yyyy\");\r\n\
                  \        \r\n        // Replace \"variable.date_com\" with the actual\
                  \ date string.\r\n        LocalDateTime dateTime = LocalDateTime.parse(\"\
                  #variable.date_com#\", dtf);\r\n        // LocalDateTime dateTime\
                  \ = LocalDateTime.parse(\"06/12/2024 15:00\", dtf);\r\n        String\
                  \ monthDay = dateTime.format(newDateFormat); // MM/dd\r\n      \
                  \  String year = dateTime.format(newDateFormatYear); // yyyy\r\n\
                  \        // put data to object \r\n        data.put(\"nom_pres_seance\"\
                  , commission_president);\r\n        data.put(\"day_month\", monthDay);\r\
                  \n        data.put(\"year\", year); \r\n        data.put(\"adress\"\
                  ,\"#variable.adresse#\");\r\n        data.put(\"commune\",\"#variable.commune#\"\
                  );\r\n        data.put(\"departement\",\"#variable.departement#\"\
                  );\r\n\r\n\r\n       \r\n        // ----------------------------------\r\
                  \n        output_file_name = \"RSU_PVcommission.docx\";\r\n    \
                  \    output_file_name2 = \"RSU_PVcommission.pdf\";\r\n\r\nLogUtil.info(\"\
                  --------------QUERY membre-------------->\", \"\");\r\nint countMembers=0;\r\
                  \nString selectMembers = \"select concat(c_nom,' ',c_prenom) as\
                  \ name,c_fonction from app_fd_membre_commission where c_id_commission=?\
                  \ ;\";\r\nstmt = con.prepareStatement(selectMembers);\r\nstmt.setString(1,\
                  \ recordid);\r\nrs = stmt.executeQuery();\r\nJSONArray MembreArray\
                  \ = new JSONArray();\r\nwhile (rs.next()) {\r\n            String\
                  \ fonction=rs.getString(\"c_fonction\");\r\n            String name=rs.getString(\"\
                  name\");\r\n            if(fonction.equals(\"Le Maire\") ||fonction.equals(\"\
                  Représentant du maire\")){\r\n                data.put(\"nom_maire\"\
                  ,name);\r\n            }else if(fonction.equals(\"Chef du GUPS\"\
                  )){\r\n                data.put(\"nom_gups\",name);\r\n        \
                  \    }else if(fonction.equals(\"Représentant 1 des ménages\")){\r\
                  \n                data.put(\"nom_rep1\",name);\r\n            }else\
                  \ if(fonction.equals(\"Représentant 2 des ménages\")){\r\n     \
                  \           data.put(\"nom_rep2\",name);\r\n            }else if(fonction.equals(\"\
                  Représentant 3 des ménages\")){\r\n                data.put(\"nom_rep3\"\
                  ,name);\r\n            }else{\r\n                countMembers++;\r\
                  \n            }\r\n            \r\n        }\r\n        data.put(\"\
                  count_members\",countMembers);\r\n\r\nLogUtil.info(\"--------------\
                  \ Count dossier -------------->\", data.toString());\r\n\r\n\r\n\
                  int countDossier=0;\r\nint countSubmitted=0;\r\nint countPauvre=0;\r\
                  \nint countPauvreExtreme=0;\r\nint countNNpauvre=0;\r\nint countNNreconnus=0;\r\
                  \nPreparedStatement stmt2 = con.prepareStatement(\"select DISTINCT\
                  \ ON (pmt.id) pmt.id, concat(ind.c_hl2a,' ',ind.c_hl2b) as fullname,\
                  \ concat(dep.c_libelle,',',arr.c_libelle,',',comm.c_libelle) as\
                  \ adress, pmt.c_categorie as categorie, pmt.c_categorie_commission\
                  \ as categorieCommission from app_fd_pmt pmt right join app_fd_dossier_commission\
                  \ com on (com.c_id_dossier=pmt.id) left join app_fd_table_individus\
                  \ ind on (ind.c_id_enquete=pmt.id) left join app_fd_table_menages\
                  \ tm on (tm.c_id_parent=pmt.id) left join app_fd_department dep\
                  \ on( dep.id=tm.c_hh1 ) left join app_fd_arrondissement arr on (arr.id=tm.c_hh3)\
                  \ left join app_fd_commune comm on (comm.id=tm.c_hh2) where com.c_id_commission=?\"\
                  );\r\nstmt2.setString(1, recordid);\r\nrs = stmt2.executeQuery();\r\
                  \nJSONArray DecisionArray = new JSONArray();\r\nwhile (rs.next())\
                  \ {\r\n          countDossier++;\r\n          JSONObject decision\
                  \ = new JSONObject();\r\n          String catComm=rs.getString(\"\
                  categorieCommission\");\r\n            decision.put(\"num\",countDossier);\r\
                  \n            decision.put(\"name\",rs.getString(\"fullname\"));\r\
                  \n            decision.put(\"adress\",rs.getString(\"adress\"));\r\
                  \n            decision.put(\"cat\",rs.getString(\"categorie\"));\r\
                  \n            decision.put(\"catcomm\",catComm);\r\n           \
                  \ if(catComm == null || catComm.isEmpty()){\r\n                \
                  \   \r\n            }else{\r\n                countSubmitted++;\r\
                  \n                if(catComm.equals(\"Pauvre\")){\r\n          \
                  \          countPauvre++;\r\n                }else if(catComm.equals(\"\
                  Extrément pauvre\")){\r\n                    countPauvreExtreme++;\r\
                  \n                }else if(catComm.equals(\"Non pauvre\")){\r\n\
                  \                    countNNpauvre++;\r\n                }else if(catComm.equals(\"\
                  Non reconnu\")){\r\n                    countNNreconnus++;\r\n \
                  \               }\r\n            }\r\n            DecisionArray.put(decision);\r\
                  \n        }\r\ndata.put(\"listDemande\", DecisionArray);\r\ndata.put(\"\
                  count_dossier\",countDossier);\r\ndata.put(\"submitted\",countSubmitted);\r\
                  \ndata.put(\"pauv_extr\",countPauvreExtreme);\r\ndata.put(\"nn_pauv\"\
                  ,countNNpauvre);\r\ndata.put(\"pauv\",countPauvre);\r\ndata.put(\"\
                  nn_recon\",countNNreconnus);\r\nLogUtil.info(\"------------data------------->\"\
                  , data.toString());\r\njsonData.put(\"data\", data);\r\njsonData.put(\"\
