            tools:
            - className: org.joget.apps.app.lib.BeanShellTool
              properties:
                script: "// preinscription\r\nimport java.sql.Connection;\r\nimport\
                  \ java.sql.PreparedStatement;\r\nimport java.sql.ResultSet;\r\n\
                  import java.sql.SQLException;\r\nimport javax.sql.DataSource;\r\n\
