                  \nimport org.joget.apps.form.model.FormData;\r\nimport java.sql.*;\r\
                  \nimport java.util.*;\r\nimport org.joget.commons.util.LogUtil;\r\
                  \nimport org.json.JSONObject;\r\nimport java.net.HttpURLConnection;\r\
                  \nimport java.net.URL;\r\nimport java.io.OutputStream;\r\nimport\
                  \ java.io.BufferedReader;\r\nimport java.io.InputStreamReader;\r\
                  \nimport org.json.JSONArray;\r\nimport org.json.JSONObject;\r\n\
                  import org.joget.apps.app.model.AppDefinition;\r\nimport org.joget.apps.app.service.AppService;\r\
                  \nimport org.joget.workflow.model.WorkflowAssignment;\r\nString\
                  \ file_name = \"Récépissé.docx\";\r\nString file_name2 = \"Récé\
                  pissé.pdf\";\r\nString table_name = \"d_preinscription\";\r\nAppService\
                  \ appService = (AppService) AppUtil.getApplicationContext().getBean(\"\
                  appService\");\r\nString recordID = appService.getOriginProcessId(workflowAssignment.getProcessId());\r\
                  \nLogUtil.info(\"--------------\",recordID);\r\nString template\
                  \ = \"/home/wuri/Projects/apidocx/templates/temp_preins_rsu.docx\"\
                  ;\r\nString generation_path = \"#appVariable.gen_path#\";\r\npublic\
                  \ String getJson() {\r\nConnection con = null;\r\nString result\
                  \ = \"\";\r\ntry {\r\n    DataSource ds = (DataSource)AppUtil.getApplicationContext().getBean(\"\
                  setupDataSource\");\r\n    con = ds.getConnection();\r\n    if (!con.isClosed())\
                  \ {\r\n        LogUtil.info(\"1=================\",\"connection\
                  \ verified\");\r\n        PreparedStatement stmt = con.prepareStatement(\"\
                  SELECT c_nom, c_prenom,app_fd_d_preinscription.dateCreated, c_departement,\
                  \ c_arrondissement, c_concession, c_role_menage, c_nom_cm, c_prenom_cm,c_commune,c_village_quartier_ville,\
                  \ c_adresse , c_id_demande ,dep.c_libelle as dep ,arr.c_libelle\
                  \ as arr,comm.c_libelle as comm FROM app_fd_d_preinscription left\
                  \ join app_fd_department dep on( dep.id=app_fd_d_preinscription.c_departement\
                  \ ) left join app_fd_arrondissement arr on (arr.id=app_fd_d_preinscription.c_arrondissement)\
                  \ left join app_fd_commune comm on (comm.id=app_fd_d_preinscription.c_commune)\
                  \ WHERE app_fd_d_preinscription.id=?;\");\r\n        stmt.setString(1,\
                  \ recordID);\r\n        LogUtil.info(\"1.2=================\",\"\
                  query not-executed\");\r\n        \r\n        ResultSet rs = stmt.executeQuery();\r\
                  \n        LogUtil.info(\"2=================\",\"query executed\"\
                  );\r\n\r\n        JSONObject jsonObject = new JSONObject();\r\n\
                  \        try {\r\n            if (rs.next()) {\r\n             \
                  \   jsonObject.put(\"Nom\", rs.getString(\"c_nom\"));\r\n      \
                  \          jsonObject.put(\"Prenom\", rs.getString(\"c_prenom\"\
                  ));\r\n                // jsonObject.put(\"Date\", rs.getString(\"\
                  dateCreated\"));\r\n                jsonObject.put(\"Date\",\" #date.dd-MM-yyyy#\"\
                  );\r\n                jsonObject.put(\"Departement\", rs.getString(\"\
                  dep\"));\r\n                jsonObject.put(\"Arrondissement\", rs.getString(\"\
                  arr\"));\r\n                jsonObject.put(\"Concession\", rs.getString(\"\
                  c_concession\"));\r\n                LogUtil.info(\"role menage----\"\
                  ,rs.getString(\"c_role_menage\"));\r\n                if(rs.getString(\"\
                  c_role_menage\").equals(\"membre\")){\r\n                    jsonObject.put(\"\
                  Nom_CM\", rs.getString(\"c_nom_cm\"));\r\n                    jsonObject.put(\"\
                  Prenom_CM\", rs.getString(\"c_prenom_cm\"));\r\n               \
                  \ }else{\r\n                    jsonObject.put(\"Nom_CM\", rs.getString(\"\
                  c_nom\"));\r\n                    jsonObject.put(\"Prenom_CM\",\
                  \ rs.getString(\"c_prenom\"));\r\n                }\r\n        \
                  \        \r\n                jsonObject.put(\"Commune\", rs.getString(\"\
                  comm\"));\r\n                jsonObject.put(\"Village\", rs.getString(\"\
                  c_village_quartier_ville\"));\r\n                LogUtil.info(\"\
                  adresse----\",rs.getString(\"c_adresse\"));\r\n                jsonObject.put(\"\
                  Addresse_Complete\", rs.getString(\"c_adresse\"));\r\n         \
                  \       jsonObject.put(\"ID_Demande\",rs.getString(\"c_id_demande\"\
                  ));\r\n            }\r\n             LogUtil.info(\"2=================\"\
                  ,jsonObject.toString());\r\n\r\n        } catch (Exception e) {\r\
                  \n            LogUtil.error(\"erreur\",e,\"   \");\r\n        }\r\
                  \n        JSONObject final_json = new JSONObject();\r\n        try{\r\
                  \n            final_json.put(\"data\",jsonObject);\r\n         \
                  \   final_json.put(\"output_file_name\",file_name);\r\n        \
                  \    final_json.put(\"output_path\",generation_path+table_name+\"\
                  /\"+recordID);\r\n            final_json.put(\"source_path\",template);\r\
                  \n        }catch(Exception e) {\r\n            // Handle exceptions\r\
                  \n            LogUtil.error(\"erreur\",e,\"   \");\r\n        \r\
                  \n        }\r\n        result=final_json.toString();\r\n    }\r\n\
                  } catch(Exception ex) {\r\n    LogUtil.error(\"erreur\",ex,\"  \
                  \ \");\r\n} finally {\r\n    try {\r\n        if(con != null)\r\n\
                  \            con.close();\r\n    } catch(SQLException e) {}\r\n\
                  }\r\n\r\nreturn result;\r\n}\r\n//-----------------------LOAD DATA\
                  \ INTO FIELDS------------------------------------------------------------\r\
                  \nString json_field = getJson();\r\nLogUtil.info(\"fichier final\"\
                  , json_field);\r\n//------------------API CALL AND RESPONSE RETRIEVAL-----------------------------------------------------------------\r\
                  \n\r\nString apiUrl = \"#appVariable.api_gen_url#\";\r\ntry {\r\n\
                  // Create URL object\r\nURL url = new URL(apiUrl);\r\n\r\n// Open\
                  \ connection\r\nHttpURLConnection connection = (HttpURLConnection)\
                  \ url.openConnection();\r\n\r\n// Set the request method to POST\r\
                  \nconnection.setRequestMethod(\"POST\");\r\n\r\n// Set Content-Type\
                  \ header to application/json\r\nconnection.setRequestProperty(\"\
                  Content-Type\", \"application/json\");\r\n\r\n// Enable output and\
                  \ input streams\r\nconnection.setDoOutput(true);\r\nconnection.setDoInput(true);\r\
                  \n\r\n// Get output stream\r\nOutputStream os = connection.getOutputStream();\r\
                  \nos.write(json_field.getBytes());\r\nos.flush();\r\nos.close();\r\
                  \n\r\n// Get response code\r\nint responseCode = connection.getResponseCode();\r\
                  \n\r\n// Read response\r\nBufferedReader in = new BufferedReader(new\
                  \ InputStreamReader(connection.getInputStream()));\r\nString inputLine;\r\
                  \nStringBuffer response = new StringBuffer();\r\n\r\nwhile ((inputLine\
                  \ = in.readLine()) != null) {\r\n    response.append(inputLine);\r\
                  \n}\r\nin.close();\r\n\r\n// Print response\r\nLogUtil.warn(\"--------------------------------------------->\"\
                  ,response.toString());\r\n//---------------------------------- Update\
                  \ DB if file generated ----------------------------------------\r\
                  \nif (responseCode == 200) {\r\n    Connection con = null;\r\n \
                  \   try {\r\n        LogUtil.warn(\"------------------------------>Response\
                  \ Code : \" , responseCode.toString());\r\n        \r\n        DataSource\
                  \ ds = (DataSource) AppUtil.getApplicationContext().getBean(\"setupDataSource\"\
                  );\r\n        con = ds.getConnection();\r\n        if (con != null\
                  \ && !con.isClosed()) {\r\n            LogUtil.warn(\"------------------------------>Connection\
                  \ Open\",\"<--------------------\");\r\n            String updateQuery\
                  \ = \"UPDATE app_fd_d_preinscription  SET c_recepisse = ? WHERE\
                  \ id = ?\";\r\n            PreparedStatement updateStatement = con.prepareStatement(updateQuery);\r\
                  \n            updateStatement.setString(1, file_name2);\r\n    \
                  \        updateStatement.setString(2, recordID);\r\n           \
                  \ updateStatement.executeUpdate();\r\n            LogUtil.warn(\"\
                  ------------------------------>Record updated successfully\",\"\
                  <-------------\");\r\n        }\r\n    } catch (Exception ex) {\r\
                  \n        LogUtil.error(\"Error: \", ex,\"------\");\r\n    } finally\
                  \ {\r\n        try {\r\n            if (con != null)\r\n       \
                  \         con.close();\r\n            LogUtil.warn(\"------------------------------>Connection\
                  \ Closed\",\"<---\");\r\n        } catch (SQLException e) {\r\n\
                  \            LogUtil.error(\"Error closing connection: \", e,\"\
                  ----\");\r\n        }\r\n    }\r\n}\r\n//-------------------------------------------------------------------------------------------------------\r\
                  \n\r\n\r\n// Close connection\r\nconnection.disconnect();\r\n} catch\
                  \ (Exception e) {\r\ne.printStackTrace();\r\n}"
      - string: verif_enquete::menage_inexistant
