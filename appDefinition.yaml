          pluginProperties:
            runInMultiThread: ''
            comment: ''
            tools:
            - className: org.joget.apps.app.lib.BeanShellTool
              properties:
                script: "// get record id \r\nimport org.joget.apps.app.service.AppService;\r\
                  \nimport org.joget.commons.util.LogUtil;\r\nimport org.joget.apps.app.service.AppUtil;\r\
                  \nimport org.joget.workflow.model.service.WorkflowManager;\r\n\r\
                  \nAppService appService = (AppService) AppUtil.getApplicationContext().getBean(\"\
                  appService\");\r\n \r\nString recordId = appService.getOriginProcessId(workflowAssignment.getProcessId());\r\
                  \n \r\nLogUtil.info(\"------ record id ---------------->\", recordId);\r\
                  \n\r\nWorkflowManager wm = (WorkflowManager) pluginManager.getBean(\"\
                  workflowManager\");\r\nwm.activityVariable(workflowAssignment.getActivityId(),\"\
                  processID\", recordId);\r\nwm.activityVariable(workflowAssignment.getActivityId(),\"\
                  chef\", \"#requestParam.chef#\");\r\nwm.activityVariable(workflowAssignment.getActivityId(),\"\
                  equipe\", \"#requestParam.membre#\");\r\n\r\n//"
            - className: org.joget.apps.app.lib.BeanShellTool
              properties:
                script: "import java.io.BufferedReader;\r\nimport java.io.IOException;\r\
                  \nimport java.io.InputStreamReader;\r\nimport java.io.OutputStream;\r\
                  \nimport java.net.HttpURLConnection;\r\nimport java.net.MalformedURLException;\r\
                  \nimport java.net.URL;\r\nimport org.json.JSONObject;\r\nimport\
                  \ org.json.JSONArray;\r\nimport org.joget.commons.util.UuidGenerator;\r\
                  \nimport java.sql.Connection;\r\nimport java.sql.PreparedStatement;\r\
                  \nimport java.sql.ResultSet;\r\nimport java.sql.SQLException;\r\n\
                  import javax.sql.DataSource;\r\nimport org.joget.apps.app.service.AppUtil;\r\
                  \nimport org.joget.workflow.model.WorkflowProcessResult;\r\nimport\
                  \ org.joget.workflow.model.service.*;\r\nimport org.joget.directory.model.Department;\r\
                  \n \r\nimport java.util.Collection;\r\nimport org.joget.apps.app.service.AppUtil;\r\
                  \nimport org.joget.directory.model.User;\r\nimport org.joget.directory.model.service.ExtDirectoryManager;\r\
                  \nimport org.joget.workflow.shark.model.dao.WorkflowAssignmentDao;\r\
                  \nimport java.util.Map;\r\nimport org.joget.commons.util.LogUtil;\r\
                  \nimport java.lang.StringBuilder;\r\n \r\n \r\nimport org.joget.apps.app.model.AppDefinition;\r\
                  \nimport org.joget.apps.app.service.AppService;\r\nimport org.joget.apps.app.service.AppUtil;\r\
                  \nimport org.joget.apps.form.model.FormRowSet;\r\nimport org.joget.apps.form.model.FormRow;\r\
                  \n \r\nimport java.util.concurrent.atomic.AtomicInteger;\r\nimport\
                  \ java.util.Calendar;\r\nimport java.nio.charset.StandardCharsets;\r\
                  \n \r\nimport java.sql.*;\r\n\r\npublic void HitApi(String lien)\
                  \ {\r\n    HttpURLConnection connHTTP = null;\r\n    BufferedReader\
                  \ reader = null;\r\n    StringBuilder responseContent = new StringBuilder();\r\
                  \n\r\n    try {\r\n        URL url = new URL(lien);\r\n        connHTTP\
                  \ = (HttpURLConnection) url.openConnection();\r\n        connHTTP.setRequestMethod(\"\
                  GET\");\r\n        connHTTP.setRequestProperty(\"Accept\", \"application/json\"\
                  );\r\n\r\n        int status = connHTTP.getResponseCode();\r\n \
                  \       LogUtil.info(\"response code\", String.valueOf(status));\r\
                  \n\r\n        InputStream inputStream = (status >= 300) ? connHTTP.getErrorStream()\
                  \ : connHTTP.getInputStream();\r\n        reader = new BufferedReader(new\
                  \ InputStreamReader(inputStream,StandardCharsets.UTF_8));\r\n\r\n\
                  \        String line;\r\n        while ((line = reader.readLine())\
                  \ != null) {\r\n            responseContent.append(line);\r\n  \
                  \          if (status >= 300) {\r\n                LogUtil.info(\"\
                  response error\", line);\r\n            }\r\n        }\r\n\r\n \
                  \   } catch (Exception e) {\r\n        LogUtil.error(\"RSU\", e,\
                  \ \"Error consuming API calcul de score\");\r\n    } finally {\r\
                  \n        try {\r\n            if (reader != null) reader.close();\r\
                  \n        } catch (IOException e) {\r\n            LogUtil.error(\"\
                  RSU\", e, \"Error closing reader\");\r\n        }\r\n        if\
                  \ (connHTTP != null) connHTTP.disconnect();\r\n    }\r\n}\r\n\r\n\
                  public String getIdMen(String query, String recordid) {\r\n    String\
                  \ id_men = \"\";\r\n\r\n    try{\r\n        Connection con = ((DataSource)\
                  \ AppUtil.getApplicationContext().getBean(\"setupDataSource\")).getConnection();\r\
                  \n        PreparedStatement stmt = con.prepareStatement(query);\r\
                  \n        stmt.setString(1, recordid);\r\n        ResultSet rs =\
                  \ stmt.executeQuery();\r\n            while(rs.next()) {\r\n   \
                  \             id_men = rs.getString(\"c_identmen\");\r\n       \
                  \     }\r\n            con.close();\r\n        \r\n    } catch (SQLException\
