                  \r\n            // Construct SOAP XML request\r\n            String\
                  \ soapRequestXML = \"<?xml version=\\\"1.0\\\" encoding=\\\"UTF-8\\\
                  \"?>\"\r\n                + \"<soapenv:Envelope xmlns:soapenv=\\\
