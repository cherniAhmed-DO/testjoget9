                  \n            CASE \r\n                WHEN '#variable.decision_finale#'\
                  \ IN ('Passer à une enquête urgente', 'Passer à une enquête classique')\
                  \ THEN 'A enquêter'\r\n                WHEN '#variable.decision_finale#'\
                  \ = 'Passer à une validation communautaire' THEN 'A valider'\r\n\
                  \                ELSE c_statut_demande\r\n            END,\r\nc_urgence\
                  \ = \r\n            CASE \r\n                WHEN '#variable.decision_finale#'\
                  \ IN ('Passer à une enquête urgente') THEN 'Urgente'\r\n       \
                  \         ELSE c_urgence\r\n            END\r\nWHERE c_npi='#variable.npi#';"
                jdbcDatasource: default
      - string: verif_enquete::setprocessid
