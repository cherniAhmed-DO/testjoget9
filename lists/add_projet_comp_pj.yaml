binder:
  className: org.melkart.plugin.JdbcDatalistBinder
  properties:
    querySource: sql
    pagination: ''
    debug: ''
    sql: "SELECT \r\n    pro.id,\r\n    pro.c_id_projet AS \"Identifiant du projet\"\
      ,\r\n    pro.c_acronyme_projet AS \"Acronyme du projet\",\r\n    pro.c_annee_demarrage_projet\
      \ AS \"Année de démarrage du projet\",\r\n    pro.c_nbre_composantes_volets\
      \ AS \"Nombre de composantes\",\r\n    pro.c_id_programme AS \"id_programme\"\
      ,\r\n    CASE \r\n        WHEN COUNT(com.id) = CAST(pro.c_nbre_composantes_volets\
      \ AS INTEGER) THEN 'hide'\r\n        ELSE 'show'\r\n    END AS isFullComposante\r\
      \nFROM \r\n    app_fd_insc_projet pro\r\nLEFT JOIN \r\n    app_fd_insc_composante\
      \ com ON pro.id = com.c_id_projet\r\nWHERE \r\n    pro.c_id_programme='#requestParam.id_programme#'\r\
      \nGROUP BY \r\n    pro.id,\r\n    pro.c_id_projet,\r\n    pro.c_acronyme_projet,\r\
      \n    pro.c_annee_demarrage_projet,\r\n    pro.c_nbre_composantes_volets"
    primaryKey: id
actions: [
  ]
order: ''