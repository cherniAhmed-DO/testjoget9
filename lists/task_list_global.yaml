binder:
  className: org.melkart.plugin.JdbcDatalistBinder
  properties:
    querySource: sql
    pagination: ''
    debug: ''
    sql: "SELECT \r\n    com.c_activityprocessid AS processID, \r\n    'damande de\
      \ réclamation' AS type,\r\n    com.createdByName AS CreatedBy, \r\n    com.c_statut\
      \ AS statut, \r\n\tcom.c_npi AS npi,\r\n    pre.c_nom AS nom,\r\n    pre.c_prenom\
      \ AS prenom,\r\n    pre.c_date_naissance AS date_naissance,\r\n    pre.c_numero_tel_principal\
      \ AS telephone,\r\n    shk.ActivityId\r\nFROM \r\n    app_fd_demande_reclamation\
      \ com  \r\nJOIN \r\n    shkassignmentstable shk ON (com.c_activityprocessid\
      \ = shk.ActivityProcessId)\r\nLEFT JOIN \r\n\tapp_fd_d_preinscription pre ON\
      \ (com.c_npi= pre.c_npi)\r\n    where shk.ResourceId='#currentUser.username#'\r\
      \nUnion\r\nSELECT \r\n    pre.c_activityprocessid AS processID, \r\n    'demande\
      \ de préinscription' AS type,\r\n    pre.createdByName AS CreatedBy, \r\n  \
      \  pre.c_statut AS statut, \r\n\tpre.c_npi AS npi,\r\n    pre.c_nom AS nom,\r\
      \n    pre.c_prenom AS prenom,\r\n    pre.c_date_naissance AS date_naissance,\r\
      \n    pre.c_numero_tel_principal AS telephone,\r\n    shk.ActivityId\r\nFROM\
      \ \r\n    app_fd_d_preinscription pre  \r\nJOIN \r\n    shkassignmentstable\
      \ shk ON (pre.c_activityprocessid = shk.ActivityProcessId)\r\n    where shk.ResourceId='#currentUser.username#'\r\
      \nunion \r\nSELECT \r\n    rad.c_activityprocessid AS processID, \r\n    'demande\
      \ de radiation' AS type,\r\n    concat(rad.createdByName,' - ',rad.c_dep_demandeur)\
      \ AS CreatedBy, \r\n    rad.c_statut AS statut, \r\n\trad.c_npi AS npi,\r\n\
      \    pre.c_nom AS nom,\r\n    pre.c_prenom AS prenom,\r\n    pre.c_date_naissance\
      \ AS date_naissance,\r\n    pre.c_numero_tel_principal AS telephone,\r\n   \
      \ shk.ActivityId\r\nFROM \r\n    app_fd_radiation rad  \r\nJOIN \r\n    shkassignmentstable\
      \ shk ON (rad.c_activityprocessid = shk.ActivityProcessId)\r\nLEFT JOIN \r\n\
      app_fd_d_preinscription pre ON (rad.c_npi= pre.c_npi)\r\n    where shk.ResourceId='#currentUser.username#'\r\
      \nunion\r\nSELECT \r\n    com.c_activityprocessid AS processID, \r\n    'validation\
      \ communutaire' AS type,\r\n    com.createdByName AS CreatedBy, \r\n    com.c_statut\
      \ AS statut, \r\n    '/' AS npi,\r\n    '/' AS nom,\r\n    '/' AS prenom,\r\n\
      \    '/' AS date_naissance,\r\n    '/' AS telephone,\r\n    shk.ActivityId\r\
      \nFROM \r\n    app_fd_commission com  \r\nJOIN \r\n    shkassignmentstable shk\
      \ ON (com.c_activityprocessid = shk.ActivityProcessId)\r\n    where shk.ResourceId='#currentUser.username#'\r\
      \nunion \r\nSELECT \r\n    rei.c_activityprocessid AS processID, \r\n    'demande\
      \ de réinscription' AS type,\r\n    rei.createdByName AS CreatedBy, \r\n   \
      \ rei.c_statut AS statut, \r\n\trei.c_npi AS npi,\r\n    pre.c_nom AS nom,\r\
      \n    pre.c_prenom AS prenom,\r\n    pre.c_date_naissance AS date_naissance,\r\
      \n    pre.c_numero_tel_principal AS telephone,\r\n    shk.ActivityId\r\nFROM\
      \ \r\n    app_fd_reinscription rei  \r\nJOIN \r\n    shkassignmentstable shk\
      \ ON (rei.c_activityprocessid = shk.ActivityProcessId)\r\nLEFT JOIN \r\napp_fd_d_preinscription\
      \ pre ON (rei.c_npi= pre.c_npi)\r\n    where shk.ResourceId='#currentUser.username#'\r\
      \n"
    primaryKey: id
actions: [
  ]
