binder:
  className: org.melkart.plugin.JdbcDatalistBinder
  properties:
    querySource: sql
    pagination: ''
    debug: 'true'
    sql: "\r\nselect p.c_identind,p.c_identmen,p.c_numero_npi,p.c_hl2a,p.c_hl2b,p.id\
      \ as \"id\",p.c_hl5m,p.c_hl5y,'non' AS \"treated\",'' as \"id_indiv\" , '' as\
      \ \"traiter\",'' as \"validation ANPS\" from app_fd_dossier_organisme dc\r\n\
      join\r\napp_fd_table_individus p on (p.id=dc.c_id_dossier)\r\nwhere dc.c_id_organisme\
      \ = '#requestParam.id_organisme#' and (select count(*) from app_fd_indiv_org\
      \ where c_id_indiv=p.id) = 0\r\nunion all \r\nselect p.c_identind,p.c_identmen,p.c_numero_npi,p.c_hl2a,p.c_hl2b,indorg.id\
      \ as \"id\",p.c_hl5m,p.c_hl5y,'yes' AS \"treated\",p.id as \"id_indiv\" , indorg.c_traiter\
      \ as \"traiter\", indorg.c_traiter_anps as \"validation ANPS\"from app_fd_dossier_organisme\
      \ dc\r\njoin\r\napp_fd_table_individus p on (p.id=dc.c_id_dossier)\r\njoin \r\
      \napp_fd_indiv_org indorg on (indorg.c_id_indiv=p.id)\r\nwhere dc.c_id_organisme\
      \ = '#requestParam.id_organisme#' and indorg.c_traiter is not null"
    primaryKey: id
