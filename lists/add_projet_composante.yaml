binder:
  className: org.melkart.plugin.JdbcDatalistBinder
  properties:
    querySource: sql
    pagination: ''
    debug: ''
    sql: "SELECT \r\n    c.c_id_composante AS composante,\r\n    c.id,\r\n    p.c_id_prg\
      \ AS programme,\r\n    pj.c_id_projet AS projet\r\nFROM \r\n    app_fd_insc_composante\
      \ c\r\nJOIN \r\n    app_fd_insc_programme p ON c.c_id_programme = p.id\r\nJOIN\
      \ \r\n    app_fd_insc_projet pj ON c.c_id_projet = pj.id\r\nWHERE \r\n    c.c_id_programme\
      \ = '#requestParam.id_programme#'\r\nGROUP BY \r\n    c.c_id_composante,\r\n\
      \    c.id,\r\n    p.c_id_prg,\r\n    pj.c_id_projet\r\n"
    primaryKey: id
