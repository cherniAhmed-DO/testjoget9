name: Liste des enquêtes PMT
id: liste_enquetes_pmt
binder:
  className: org.melkart.plugin.JdbcDatalistBinder
  properties:
    querySource: sql
    pagination: 'true'
    debug: 'true'
    sql: "select pmt.id as id, pmt.c_compagne_enquete AS \"Compagne d'enquêtes\",\r\
      \npmt.c_menage_existe AS \"Ménage existe\",\r\npmt.c_statut_enquete AS \"Statut\
      \ de l'enquête\",\r\npmt.c_urgence AS \"Urgence\",\r\npmt.c_score AS \"score\"\
      ,\r\npmt.c_categorie AS \"categorie\",\r\npmt.c_npi_preinscription AS \"Npi\
      \ Existant\",\r\npmt.c_npi_inexistant AS \"NPI inexistant\",\r\npmt.c_statut_profile\
      \ AS \"Statut profil\",\r\npmt.c_choc AS \"Statut choc\",\r\ncom.c_libelle AS\
      \ \"commune\",\r\narr.c_libelle AS \"arrondissement\",\r\ndep.c_libelle AS \"\
      Département\",\r\ninsc.id as \"ID preinscri\" from app_fd_pmt pmt \r\njoin app_fd_d_preinscription\
      \ insc on (pmt.c_npi_preinscription=insc.c_npi) \r\njoin app_fd_commune com\
      \ on (insc.c_commune=com.id)\r\njoin app_fd_arrondissement arr on (insc.c_arrondissement=arr.id)\r\
      \njoin app_fd_department dep on (insc.c_departement=dep.id)"
    primaryKey: id
