                  \n        PreparedStatement stmtSelectFolders = con.prepareStatement(\"\
                  select p.c_npi,p.c_statut_profile,p.c_type_inactivite,p.c_date_radiation,count(d.id)\
                  \ AS countDes from app_fd_d_preinscription p join app_fd_desincription\
                  \ d on (p.c_npi=d.c_npi)  where p.c_npi=? group by p.c_npi,c_statut_profile,c_date_radiation,c_type_inactivite;\"\
                  );\r\n            stmtSelectFolders.setString(1,values[0]);\r\n\
                  \        ResultSet rs1 = stmtSelectFolders.executeQuery();\r\n \
                  \       while (rs1.next()) {\r\n            npi=rs1.getString(\"\
                  c_npi\"); \r\n            statusProfile=rs1.getString(\"c_statut_profile\"\
                  );\r\n            typeInactivite=rs1.getString(\"c_type_inactivite\"\
                  );\r\n            dateRadiation=rs1.getString(\"c_date_radiation\"\
                  );\r\n            nombreDes=nombreDes+rs1.getInt(\"countDes\");\r\
                  \n            LogUtil.info(\"nombre des \",nombreDes.toString());\r\
                  \n            // date dateRadiationReel=dateRadiation.parse(\"yyyy-MM-dd\"\
                  );\r\n        }\r\n        \r\n        if (dateRadiation != null\
                  \ && !dateRadiation.isEmpty()) {\r\n            // Convert String\
                  \ to LocalDate\r\n            LocalDate dbDate = LocalDate.parse(dateRadiation,\
                  \ DateTimeFormatter.ofPattern(\"yyyy-MM-dd\"));\r\n            LocalDate\
                  \ today = LocalDate.now();\r\n            daysDifference = ChronoUnit.DAYS.between(today,\
                  \ dbDate);\r\n            if(dbDate.isBefore(today)){\r\n      \
                  \          isBeforeToday=false;\r\n            }else{\r\n      \
                  \          isBeforeToday=true;\r\n            }\r\n        }\r\n\
                  \r\n    }\r\n} catch(Exception e) {\r\n    LogUtil.error(\"verifying\
                  \ NPI and desinscription \", e, \"error\");\r\n} finally {\r\n \
                  \   try {\r\n        if(con != null) {\r\n            con.close();\r\
