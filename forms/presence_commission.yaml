              \nimport org.joget.apps.form.model.FormRowSet;\r\nimport org.joget.apps.form.service.FormUtil;\r\
              \nimport java.util.Arrays;\r\n\r\nimport org.joget.directory.model.service.DirectoryManager;\r\
              \nimport org.joget.directory.model.User;\r\nimport org.joget.commons.util.LogUtil;\r\
              \nimport java.util.*;\r\nimport org.joget.apps.app.service.AppUtil;\r\
              \n\r\n\r\n\r\npublic FormRowSet load(Element element, String primaryKey,\
              \ FormData formData) {\r\nString departmentId = \"gups\"; // Replace\
              \ with your department ID\r\nString gradeId = \"responsable\";  // Replace\
              \ with your role ID\r\n\r\n    FormRowSet rows = new FormRowSet();\r\
              \n\r\n    // Add default value \"--\"\r\n    FormRow defaultOption =\
              \ new FormRow();\r\n    defaultOption.setProperty(FormUtil.PROPERTY_VALUE,\
              \ \"\");\r\n    defaultOption.setProperty(FormUtil.PROPERTY_LABEL, \"\
              \");\r\n    rows.add(defaultOption);\r\n\r\n    // Array of countries\
              \ in French\r\n    // Collection matchedUsers = new ArrayList();\r\n\
              \r\n    try {\r\n        // Get the DirectoryManager instance\r\n  \
              \      DirectoryManager directoryManager = (DirectoryManager) AppUtil.getApplicationContext().getBean(\"\
              directoryManager\");\r\n    \r\n        // Retrieve users based on filters\r\
              \n        Collection users = directoryManager.getUsers(null, \"rsu\"\
              , departmentId, gradeId, null, null, \"1\", null, false, null, null);\r\
              \n        // Iterate through users and collect usernames\r\n       \
              \ for (Object obj : users) {\r\n            User user = (User) obj;\r\
              \n            LogUtil.info(\"user ---> \" , user.toString());\r\n  \
              \          FormRow option = new FormRow();\r\n            option.setProperty(FormUtil.PROPERTY_VALUE,\
              \ user.getUsername());\r\n            option.setProperty(FormUtil.PROPERTY_LABEL,\
              \ user.getFirstName()+user.getLastName());\r\n            rows.add(option);\r\
              \n            // matchedUsers.add(user.getUsername());\r\n        }\r\
              \n    \r\n        // return matchedUsers;\r\n        // Log the matched\
              \ users\r\n        LogUtil.info(\"ProcessMapping\", \"Matched Users:\
              \ \" + rows.toString());\r\n    \r\n    } catch (Exception e) {\r\n\
              \        LogUtil.error(\"ProcessMapping\", e, e.getMessage());\r\n \
              \   }\r\n \r\n\r\n    // Add sorted countries to the rows\r\n\r\n\r\n\
              \    return rows;\r\n}\r\n\r\n// Call load method with injected variables\r\
              \nreturn load(element, primaryKey, formData);\r\n"
