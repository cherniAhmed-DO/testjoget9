        id: field9
        value: "<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css\"\
          \ />\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js\"\
          ></script>\r\n<script>\r\n  $(document).ready(function(){\r\n    const fields\
          \ = [\"num_tel\"]; // List of input field IDs\r\n\r\nfields.forEach((fieldId)\
          \ => {\r\n    const input = document.getElementById(fieldId);\r\n    const\
          \ countryCode1=document.getElementById('country_code_num_1').value;\r\n\
          \    countryCodeSetup=\"\";\r\n    if(fieldId==\"num_tel\"){\r\n       \
          \ countryCodeSetup=countryCode1!=''?countryCode1:'BJ';\r\n        document.getElementById('country_code_num_1').value=document.getElementById('country_code_num_1').value!=''?document.getElementById('country_code_num_1').value:'BJ';\r\
          \n    }\r\n    \r\n    const iti = window.intlTelInput(input, {\r\n    \
          \    initialCountry: countryCodeSetup, // Set default country to Benin\r\
          \n        separateDialCode: true, // Display dial code separately\r\n  \
          \      nationalMode: false,    // Allows free input without enforcing format\r\
          \n        formatOnDisplay: false, // Prevents automatic formatting\r\n \
          \       geoIpLookup: function (callback) {\r\n           \r\n          \
          \  callback(\"BJ\");\r\n        },\r\n        utilsScript: \"https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js\"\
          , // Required for formatting\r\n    });\r\n    input.addEventListener('countrychange',\
          \ () => {\r\n            const countryData = iti.getSelectedCountryData();\
          \ // Get the selected country data\r\n            input.value=\"\";\r\n\
          \            // input.value=countryData.dialCode+' ';\r\n            if(fieldId==\"\
          num_contacter\"){\r\n               document.getElementById('country_code_num_1').value=countryData.iso2;\r\
          \n            }\r\n        });\r\n\r\n  \r\n\r\n    \r\n});\r\n  })\r\n\
          </script>\r\n"
