                script: "import java.sql.Connection;\r\nimport java.sql.PreparedStatement;\r\
                  \nimport java.sql.ResultSet;\r\nimport java.sql.SQLException;\r\n\
                  import javax.sql.DataSource;\r\nimport org.joget.apps.app.service.AppUtil;\r\
                  \nimport org.joget.commons.util.LogUtil;\r\nimport org.joget.apps.app.service.AppUtil;\r\
                  \nimport org.joget.workflow.model.service.WorkflowManager;\r\nimport\
                  \ org.joget.commons.util.LogUtil;\r\n\r\nimport java.util.Arrays;\r\
                  \nimport org.joget.apps.form.model.Element;\r\nimport org.joget.apps.form.model.FormData;\r\
                  \nimport org.joget.apps.form.service.FormUtil;\r\nint countPerson=0;\r\
                  \nString prenom = formData.getRequestParameter(\"prenom\");\r\n\
                  String nom = formData.getRequestParameter(\"nom\");\r\nWorkflowManager\
                  \ workflowManager = (WorkflowManager) AppUtil.getApplicationContext().getBean(\"\
                  workflowManager\");\r\nConnection con = null;\r\nLogUtil.warn(\"\
                  checking id\", \"#form.membre_commission.id#\");\r\n\r\n    try\
                  \ {\r\n        DataSource ds = (DataSource)AppUtil.getApplicationContext().getBean(\"\
                  setupDataSource\");\r\n        con = ds.getConnection();\r\n   \
                  \     if(!con.isClosed()) {\r\n            PreparedStatement stmtSelectFolders\
                  \ = con.prepareStatement(\"select count(*) AS countRecords from\
                  \ app_fd_membre_commission where c_id_commission=? and c_nom=? and\
                  \ c_prenom=? and id <> ?\");\r\n            stmtSelectFolders.setString(1,\"\
                  #requestParam.id_commission#\");\r\n            stmtSelectFolders.setString(2,nom);\r\
                  \n            stmtSelectFolders.setString(3,prenom);\r\n       \
                  \     stmtSelectFolders.setString(4,\"#form.membre_commission.id#\"\
                  );\r\n             LogUtil.warn(\"values counting person \", \"\
                  #requestParam.id_commission#\"+\" \"+nom+\" \"+prenom);\r\n    \r\
                  \n            ResultSet rs1 = stmtSelectFolders.executeQuery();\r\
                  \n            while (rs1.next()) {\r\n                countPerson=rs1.getInt(\"\
                  countRecords\"); \r\n            }\r\n        }\r\n    } catch(Exception\
                  \ e) {\r\n        LogUtil.error(\"adding person to commissiont \"\
                  , e, \"error\");\r\n    } finally {\r\n        try {\r\n       \
                  \     if(con != null) {\r\n                con.close();\r\n    \
                  \        }\r\n        } catch(SQLException e) {/* ignored */}\r\n\
                  \    }\r\n\r\n\r\nif (countPerson!=0 ) {\r\n    String id = FormUtil.getElementParameterName(element);\r\
                  \n    formData.addFormError(id, \"VOUS NE POUVEZ PAS ETRE DANS LA\
                  \ MEME COMMISSION DEUX FOIS\");\r\n    return false;\r\n}else{\r\
                  \n      return true;\r\n}\r\n"
