                  \nimport org.joget.apps.form.model.Element;\r\nimport org.joget.apps.form.model.FormData;\r\
                  \nimport org.joget.apps.form.service.FormUtil;\r\n\r\n\r\nString\
                  \ field1Id = \"country_code_num_1\";\r\n\r\nString fieldValue =\
                  \ formData.getRequestParameter(field1Id);\r\n\r\nLogUtil.info(\"\
                  country code,\",fieldValue);\r\nLogUtil.info(\"phone numver,\",values[0]);\r\
                  \n\r\nif (fieldValue.equals(\"BJ\") && values[0].length() < 10)\
