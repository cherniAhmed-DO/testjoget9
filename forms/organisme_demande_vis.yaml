          , 0, position, imgWidth, imgHeight);\r\n    heightLeft -= pdfHeight;\r\n\
          \  }\r\n\r\n  pdf.save(\"Demande.pdf\");\r\n  document.body.removeChild(hidden);\r\
          \n}\r\n\r\n </script>\r\n"
