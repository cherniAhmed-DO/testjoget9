          \n// }\r\nfunction injectIframeContent(clone, iframeId) {\r\n  const originalIframe\
          \ = document.getElementById(iframeId);\r\n  const iframeContent = originalIframe.contentDocument?.documentElement;\r\
          \n\r\n  if (!iframeContent) {\r\n    console.warn(`Iframe ${iframeId} has\
