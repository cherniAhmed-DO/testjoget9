  postProcessor:
    className: org.joget.apps.app.lib.BeanShellTool
    properties:
      script: "import org.joget.commons.util.LogUtil;\r\nimport java.net.HttpURLConnection;\r\
        \nimport java.net.URL;\r\nimport java.io.OutputStream;\r\nimport java.io.InputStream;\r\
        \nimport java.io.BufferedReader;\r\nimport java.io.InputStreamReader;\r\n\
        import java.security.KeyStore;\r\nimport javax.net.ssl.KeyManagerFactory;\r\
        \nimport javax.net.ssl.SSLContext;\r\nimport javax.net.ssl.TrustManagerFactory;\r\
        \nimport javax.net.ssl.HttpsURLConnection;\r\n\r\ntry {\r\n    // Path to\
        \ the keystore and its password (use an absolute path or relative path from\
        \ the app's working directory)\r\n    String keystorePath = \"/opt/joget/wflow/keystore.jks\"\
        ;  // Change this to the correct path\r\n    String keystorePassword = \"\
        changeit\";\r\n\r\n    // Load the keystore\r\n    KeyStore keyStore = KeyStore.getInstance(\"\
        JKS\");\r\n    InputStream keyStoreStream = new FileInputStream(keystorePath);\
        \ // Directly using FileInputStream\r\n    keyStore.load(keyStoreStream, keystorePassword.toCharArray());\r\
        \n    keyStoreStream.close();\r\n\r\n    // Initialize KeyManagerFactory and\
        \ TrustManagerFactory\r\n    KeyManagerFactory keyManagerFactory = KeyManagerFactory.getInstance(KeyManagerFactory.getDefaultAlgorithm());\r\
        \n    keyManagerFactory.init(keyStore, keystorePassword.toCharArray());\r\n\
        \r\n    TrustManagerFactory trustManagerFactory = TrustManagerFactory.getInstance(TrustManagerFactory.getDefaultAlgorithm());\r\
        \n    trustManagerFactory.init(keyStore);\r\n\r\n    // Create and initialize\
        \ the SSLContext\r\n    SSLContext sslContext = SSLContext.getInstance(\"\
        TLS\");\r\n    sslContext.init(keyManagerFactory.getKeyManagers(), trustManagerFactory.getTrustManagers(),\
        \ null);\r\n\r\n    // Set the default SSL context\r\n    HttpsURLConnection.setDefaultSSLSocketFactory(sslContext.getSocketFactory());\r\
        \n\r\n    // Define SOAP endpoint and request properties\r\n    String endpoint\
        \ = \"https://10.208.0.78\";\r\n    String soapAction = \"CITIZEN_BY_NPI_ANPS\"\
        ;\r\n\r\n    // Construct SOAP XML request\r\n    String soapRequestXML1 =\
        \ \"<?xml version=\\\"1.0\\\" encoding=\\\"UTF-8\\\"?>\"\r\n        + \"<soapenv:Envelope\
        \ xmlns:soapenv=\\\"http://schemas.xmlsoap.org/soap/envelope/\\\" \"\r\n \
        \       + \"xmlns:xro=\\\"http://x-road.eu/xsd/xroad.xsd\\\" \"\r\n      \
        \  + \"xmlns:iden=\\\"http://x-road.eu/xsd/identifiers\\\" \"\r\n        +\
        \ \"xmlns:ns=\\\"http://x-road.eu/xsd/connector/CITIZEN_BY_NPI_ANPS/v1\\\"\
        >\"\r\n        + \"<soapenv:Header>\"\r\n        + \"<xro:client iden:objectType=\\\
        \"SUBSYSTEM\\\">\"\r\n        + \"<iden:xRoadInstance>BJ</iden:xRoadInstance>\"\
        \r\n        + \"<iden:memberClass>GOV</iden:memberClass>\"\r\n        + \"\
        <iden:memberCode>ANPS</iden:memberCode>\"\r\n        + \"<iden:subsystemCode>RSU</iden:subsystemCode>\"\
        \r\n        + \"</xro:client>\"\r\n        + \"<xro:service iden:objectType=\\\
        \"SERVICE\\\">\"\r\n        + \"<iden:xRoadInstance>BJ</iden:xRoadInstance>\"\
        \r\n        + \"<iden:memberClass>GOV</iden:memberClass>\"\r\n        + \"\
        <iden:memberCode>ANIP</iden:memberCode>\"\r\n        + \"<iden:subsystemCode>RNP</iden:subsystemCode>\"\
        \r\n        + \"<iden:serviceCode>CITIZEN_BY_NPI_ANPS</iden:serviceCode>\"\
        \r\n        + \"<iden:serviceVersion>v1</iden:serviceVersion>\"\r\n      \
        \  + \"</xro:service>\"\r\n        + \"<xro:userId></xro:userId>\"\r\n   \
        \     + \"<xro:id></xro:id>\"\r\n        + \"<xro:protocolVersion>4.0</xro:protocolVersion>\"\
        \r\n        + \"</soapenv:Header>\"\r\n        + \"<soapenv:Body>\"\r\n  \
        \      + \"<ns:CITIZEN_BY_NPI_ANPS>\"\r\n        + \"<NPI>00000000</NPI>\"\
        \r\n        + \"</ns:CITIZEN_BY_NPI_ANPS>\"\r\n        + \"</soapenv:Body>\"\
        \r\n        + \"</soapenv:Envelope>\";\r\n        \r\n String soapRequestXML\
        \ = \r\n    \"<soapenv:Envelope xmlns:soapenv=\\\"http://schemas.xmlsoap.org/soap/envelope/\\\
        \" \"\r\n    + \"xmlns:xro=\\\"http://x-road.eu/xsd/xroad.xsd\\\" \"\r\n \
        \   + \"xmlns:iden=\\\"http://x-road.eu/xsd/identifiers\\\" \"\r\n    + \"\
        xmlns:ns=\\\"http://x-road.eu/xsd/connector/CITIZEN_BY_NPI_ANPS/v1\\\">\\\
        n\"\r\n    + \"    <soapenv:Header>\\n\"\r\n    + \"        <xro:client iden:objectType=\\\
        \"SUBSYSTEM\\\">\\n\"\r\n    + \"            <iden:xRoadInstance>BJ</iden:xRoadInstance>\\\
        n\"\r\n    + \"            <iden:memberClass>GOV</iden:memberClass>\\n\"\r\
        \n    + \"            <iden:memberCode>ANPS</iden:memberCode>\\n\"\r\n   \
        \ + \"            <!--Optional:-->\\n\"\r\n    + \"            <iden:subsystemCode>RSU</iden:subsystemCode>\\\
        n\"\r\n    + \"        </xro:client>\\n\"\r\n    + \"        <xro:service\
        \ iden:objectType=\\\"SERVICE\\\">\\n\"\r\n    + \"            <iden:xRoadInstance>BJ</iden:xRoadInstance>\\\
        n\"\r\n    + \"            <iden:memberClass>GOV</iden:memberClass>\\n\"\r\
        \n    + \"            <iden:memberCode>ANIP</iden:memberCode>\\n\"\r\n   \
        \ + \"            <!--Optional:-->\\n\"\r\n    + \"            <iden:subsystemCode>RNP</iden:subsystemCode>\\\
        n\"\r\n    + \"            <iden:serviceCode>CITIZEN_BY_NPI_ANPS</iden:serviceCode>\\\
        n\"\r\n    + \"            <!--Optional:-->\\n\"\r\n    + \"            <iden:serviceVersion>v1</iden:serviceVersion>\\\
        n\"\r\n    + \"        </xro:service>\\n\"\r\n    + \"        <xro:userId></xro:userId>\\\
        n\"\r\n    + \"        <xro:id></xro:id>\\n\"\r\n    + \"        <xro:protocolVersion>4.0</xro:protocolVersion>\\\
        n\"\r\n    + \"    </soapenv:Header>\\n\"\r\n    + \"    <soapenv:Body>\\\
        n\"\r\n    + \"        <ns:CITIZEN_BY_NPI_ANPS>\\n\"\r\n    + \"         \
        \   <NPI>5264257695</NPI>\\n\"\r\n    + \"        </ns:CITIZEN_BY_NPI_ANPS>\\\
        n\"\r\n    + \"    </soapenv:Body>\\n\"\r\n    + \"</soapenv:Envelope>\";\r\
        \n\r\n        \r\n\r\n    // Open HTTP connection\r\n    URL url = new URL(endpoint);\r\
        \n    HttpURLConnection conn = (HttpURLConnection) url.openConnection();\r\
        \n    conn.setRequestMethod(\"POST\");\r\n    conn.setDoOutput(true);\r\n\
        \    conn.setRequestProperty(\"Content-Type\", \"text/xml;charset=UTF-8\"\
        );\r\n    conn.setRequestProperty(\"SOAPAction\", soapAction);\r\n\r\n   \
        \ OutputStream os = null;\r\n    InputStream is = null;\r\n    BufferedReader\
        \ br = null;\r\n    try {\r\n        // Send the SOAP request\r\n        os\
        \ = conn.getOutputStream();\r\n        os.write(soapRequestXML.getBytes(\"\
        UTF-8\"));\r\n        os.flush();\r\n\r\n        // Get the SOAP response\r\
        \n        is = conn.getInputStream();\r\n        br = new BufferedReader(new\
        \ InputStreamReader(is));\r\n        StringBuilder response = new StringBuilder();\r\
        \n        String line;\r\n        while ((line = br.readLine()) != null) {\r\
        \n            response.append(line);\r\n        }\r\n\r\n        // Log the\
        \ response\r\n        LogUtil.info(\"SOAP Response\", response.toString());\r\
        \n\r\n        // Save the response into a workflow variable if needed\r\n\
        \        // workflowAssignment.setVariable(\"soapResponse\", response.toString());\r\
        \n    } finally {\r\n        // Close resources\r\n        if (os != null)\
        \ {\r\n            os.close();\r\n        }\r\n        if (br != null) {\r\
        \n            br.close();\r\n        }\r\n        if (is != null) {\r\n  \
        \          is.close();\r\n        }\r\n    }\r\n\r\n} catch (Exception e)\
        \ {\r\n    LogUtil.error(\"SOAP Post Processing Tool\", e, \"Error occurred\
        \ while making SOAP request\");\r\n}\r\n"
