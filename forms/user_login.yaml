  postProcessor:
    className: org.joget.apps.app.lib.BeanShellTool
    properties:
      script: "import java.util.HashSet;\r\nimport java.util.Set;\r\nimport org.joget.apps.app.service.AppUtil;\r\
        \nimport org.joget.apps.form.model.Element;\r\nimport org.joget.apps.form.model.FormData;\r\
        \nimport org.joget.apps.form.model.FormRow;\r\nimport org.joget.apps.form.model.FormRowSet;\r\
        \nimport org.joget.commons.util.LogUtil;\r\nimport org.joget.commons.util.StringUtil;\r\
        \nimport org.joget.directory.model.Role;\r\nimport org.joget.directory.model.User;\r\
        \nimport org.joget.directory.model.Group;\r\nimport org.joget.directory.dao.RoleDao;\r\
        \nimport org.joget.directory.dao.UserDao;\r\nimport org.joget.directory.dao.GroupDao;\r\
        \nimport org.joget.directory.model.Department;\r\nimport org.joget.directory.dao.DepartmentDao;\r\
        \nimport org.joget.directory.model.service.DirectoryUtil;\r\nimport org.joget.directory.model.service.UserSecurity;\r\
        \nimport java.util.Map;\r\nimport org.joget.apps.app.model.AppDefinition;\r\
        \nimport org.joget.apps.app.service.AppPluginUtil;\r\nimport org.joget.plugin.base.ApplicationPlugin;\r\
        \nimport org.joget.plugin.base.Plugin;\r\nimport org.joget.plugin.base.PluginManager;\r\
        \nimport org.joget.plugin.property.model.PropertyEditable;\r\nimport org.joget.workflow.util.WorkflowUtil;\r\
        \nimport javax.servlet.http.HttpServletResponse;\r\nimport org.joget.directory.model.Employment;\r\
        \nimport org.joget.directory.dao.EmploymentDao;\r\nimport java.lang.String;\r\
        \nimport org.joget.commons.util.UuidGenerator;\r\n\r\nString email = \"#form.user_login.email#\"\
        ;\r\nString firstName = \"#form.user_login.nom#\";\r\nString lastName = \"\
        #form.user_login.prenom#\";\r\nString email = \"#form.user_login.email#\"\
        ;\r\nString password = \"#form.user_login.mdp#\" ;\r\nString deptId = \"demandeur_enLigne\"\
        ;\r\n\r\npublic void addToDept(String userID,String deptId){\r\n    EmploymentDao\
        \ employmentDao =(EmploymentDao) AppUtil.getApplicationContext().getBean(\"\
        employmentDao\");\r\n    UuidGenerator uuid = UuidGenerator.getInstance();\r\
        \n    String pId = uuid.getUuid();\r\n    Employment emp = new Employment();\r\
        \n    emp.setId(pId);\r\n    emp.setUserId(userID);\r\n    emp.setOrganizationId(\"\
        rsu\");\r\n    emp.setDepartmentId(deptId);\r\n    LogUtil.warn(\"----- User\
        \ \"+userID+\" assigned to departement --->\"+deptId,String.valueOf(employmentDao.addEmployment(emp)));\r\
        \n    LogUtil.info(\"--------------- Affect to departement ---------->\",\
        \ String.valueOf(employmentDao.assignUserToDepartment(userID, deptId)));\r\
        \n}\r\n\r\ntry {\r\n    UserSecurity us = DirectoryUtil.getUserSecurity();\r\
        \n    UserDao userDao = (UserDao) AppUtil.getApplicationContext().getBean(\"\
        userDao\");\r\n    RoleDao roleDao = (RoleDao) AppUtil.getApplicationContext().getBean(\"\
        roleDao\");\r\n    GroupDao groupDao = (GroupDao) AppUtil.getApplicationContext().getBean(\"\
        groupDao\");\r\n    DepartmentDao departmentDao = (DepartmentDao) AppUtil.getApplicationContext().getBean(\"\
        departmentDao\");\r\n    Department department = departmentDao.getDepartment(deptId);\r\
        \n    User user = new User();\r\n    user.setId(email);\r\n    user.setUsername(email);\r\
        \n    user.setTimeZone(\"0\");\r\n    user.setActive(1);\r\n    user.setFirstName(firstName);\r\
        \n    user.setLastName(lastName);\r\n    user.setEmail(email);\r\n    //Check\
        \ if there is user security implementation, using it to encrypt password\r\
        \n    if (us != null) {\r\n        user.setPassword(us.encryptPassword(email,\
        \ password));\r\n    } else {\r\n        user.setPassword(StringUtil.md5Base16(password));\r\
        \n    }\r\n    user.setConfirmPassword(password);\r\n    \r\n    Set groupSet\
        \ = new HashSet();\r\n    String groupName=\"RSU Users\";\r\n    Group group\
        \ = groupDao.getGroupByName(groupName);\r\n    if (group != null) {\r\n  \
        \      groupSet.add(group);\r\n    }\r\n    user.setGroups(groupSet);\r\n\
        \    \r\n    Set roleSet = new HashSet();\r\n    Role role = roleDao.getRoleByName(\"\
        User\");\r\n    roleSet.add(role);\r\n    user.setRoles(roleSet);\r\n    \r\
        \n   \r\n    \r\n\r\n    \r\n    \r\n    userDao.addUser(user);\r\n\r\n  \
        \  if ( department != null ){\r\n        LogUtil.info(\"departement non nul\"\
        ,department.toString());\r\n        LogUtil.warn(\"departement=\",deptId);\r\
        \n        addToDept(email,deptId);\r\n}\r\n    \r\n    if (us != null) {\r\
        \n        us.insertUserPostProcessing(user);\r\n        \r\n    }\r\n} catch\
        \ (Exception e) {\r\nLogUtil.error(\"Sample app -  Create User form\", e,\
        \ \"user error!!\");\r\n}\r\nString mailSubject=\"RSU : Votre compte a été\
        \ créé avec succès.\";\r\nString mailContent = \"Bonjour, \\n\\n\" +\r\n \
        \   \"Nous sommes ravis de vous informer que votre compte a été créé avec\
        \ succès : \\n\" +\r\n    \"Nom d'utilisateur : \" + email + \" \\n\" +\r\n\
        \    \"Mot de passe : \" + password + \" \\n\\n\" +\r\n    \"Pour vous connecter,\
        \ veuillez utiliser le lien suivant :<a href=\\\"#envVariable.url#/jw\\\"\
        >Cliquez ici</a> <br>  \\n\\n\" +\r\n    \"Important : Pour des raisons de\
        \ sécurité, nous vous recommandons vivement de changer votre mot de passe\
        \ dès votre première connexion. \\n\\n\" +\r\n    \"N'hésitez pas à nous contacter\
        \ si vous avez besoin d'une assistance supplémentaire. \\n\\n\" +\r\n    \"\
        Cordialement,\";\r\n//Email Tool to send email;\r\nPlugin plugin = pluginManager.getPlugin(\"\
        org.joget.apps.app.lib.EmailTool\");\r\nMap propertiesMap = AppPluginUtil.getDefaultProperties(plugin,\
        \ null, appDef, null);\r\npropertiesMap.put(\"pluginManager\", pluginManager);\r\
        \npropertiesMap.put(\"appDef\", appDef);\r\npropertiesMap.put(\"request\"\
        , request);\r\nApplicationPlugin emailTool = (ApplicationPlugin) plugin;\r\
        \npropertiesMap.put(\"toSpecific\", email);\r\npropertiesMap.put(\"subject\"\
        , mailSubject);\r\npropertiesMap.put(\"message\", mailContent);\r\n((PropertyEditable)\
        \ emailTool).setProperties(propertiesMap);\r\nemailTool.execute(propertiesMap);\r\
        \nLogUtil.info(\"end\",\"-----------------\");"
