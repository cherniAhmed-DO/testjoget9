          \n                            confirmButtonText: 'OK'\r\n              \
          \          }).then((result) => {\r\n                            if (result.isConfirmed)\
          \ {\r\n                                    // Close the SweetAlert popup\
          \ (default action)\r\n                                    Swal.close();\
          \ \r\n                            }\r\n                        });\r\n \
          \                   }\r\n                }\r\n            } catch (err)\
          \ {\r\n                console.error(\"Error parsing _FORM_ERRORS:\", err);\r\
          \n            }\r\n        }else if(formSuccess.length > 0){\r\n       \
          \     Swal.fire({\r\n                title: 'Votre compte a été créé avec\
          \ succès',\r\n                html: 'Bienvenue chez l\\'RSU Vous pouvez\
          \ maintenant vous connecter', // Format messages as HTML\r\n           \
          \     icon: 'success',\r\n                confirmButtonText: 'OK'\r\n  \
          \          }).then((result) => {\r\n                if (result.isConfirmed)\
          \ {\r\n                    window.location.href = '/jw/web/login'; // Change\
          \ to your desired URL\r\n                }\r\n            });\r\n      \
          \  }\r\n    });\r\n</script>\r\n"
