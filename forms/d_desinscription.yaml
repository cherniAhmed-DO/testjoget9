          \                   if (errors.errors) {\r\n                        // Collect\
          \ all error messages\r\n                        let errorMessages = Object.values(errors.errors);\r\
          \n    \r\n                        if (errorMessages.length > 0) {\r\n  \
          \                          // Show SweetAlert popup with validation messages\r\
          \n                            Swal.fire({\r\n                          \
          \      title: 'Erreur lors de l\\'enregistrement de la demande de la ré\
          clamation',\r\n                                html: errorMessages.join('<br>'),\
          \ // Format messages as HTML\r\n                                icon: 'error',\r\
          \n                                confirmButtonText: 'OK'\r\n          \
          \                  }).then((result) => {\r\n                           \
          \     if (result.isConfirmed) {\r\n                                    const\
          \ specificError1 = \"Vous devez être au moins préinscrit au RSU pour pouvoir\
          \ passer une demande de réclamation\";\r\n                             \
          \       const specificError2 = \"il y'a déja une demande de réclamation\
          \ de même type et même NPI\";\r\n    \r\n                              \
          \      if (errorMessages.some(msg => msg.includes(specificError1) || msg.includes(specificError2)))\
          \ {\r\n                                        // Redirect to a specific\
          \ URL\r\n                                        window.location.href =\
          \ '/jw/web/userview/rsu/rsu_userview/_/welcome';\r\n                   \
          \                 }\r\n                                }\r\n           \
          \                 });\r\n                        } else {\r\n          \
          \                  console.log('No error messages found');\r\n         \
          \               }\r\n                    }\r\n                } catch (err)\
          \ {\r\n                    console.error(\"Error parsing _FORM_ERRORS:\"\
          , err);\r\n                }\r\n            }else if(formSuccess.length\
          \ > 0){\r\n            Swal.fire({\r\n                title: 'Vous êtes\
          \ désinscrit de l\\'RSU',\r\n                html: 'vous serez maintenant\
          \ déconnecté', // Format messages as HTML\r\n                icon: 'success',\r\
          \n                confirmButtonText: 'OK'\r\n            }).then((result)\
          \ => {\r\n                if (result.isConfirmed) {\r\n                \
          \    window.location.href = '/jw/j_spring_security_logout'; // Change to\
          \ your desired URL\r\n                }\r\n            });\r\n        }\r\
          \n    \r\n            // Handle confirmation dialog for the submit button\r\
          \n            document.getElementById('submit')?.addEventListener(\"click\"\
          , function (e) {\r\n                e.preventDefault();\r\n    \r\n    \
          \            Swal.fire({\r\n                    title: 'Êtes-vous sûr de\
          \ vouloir vous désinscrire du registre social unique? Si vous confirmez,\
          \ vous serez systématiquement déconnecté.',\r\n                    icon:\
          \ 'warning',\r\n                    showCancelButton: true,\r\n        \
          \            confirmButtonText: 'Oui, confirmer',\r\n                  \
          \  cancelButtonText: 'Annuler'\r\n                }).then((result) => {\r\
          \n                    if (result.isConfirmed) {\r\n                    \
          \    // Programmatically submit the form\r\n                        document.getElementById(\"\
          d_desinscription\").requestSubmit();\r\n                    }\r\n      \
          \          });\r\n            });\r\n        });\r\n    </script>\r\n  \
          \  "
