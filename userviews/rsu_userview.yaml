        <p style="font-size: 1.2em; line-height: 1.5; margin: 20px 0;">La Plateforme RSU a pour mission de centraliser les donn&eacute;es des personnes n&eacute;cessiteuses. Elle permet de faciliter l'acc&egrave;s &agrave; des ressources, services et aides adapt&eacute;es &agrave; leurs besoins.</p>
