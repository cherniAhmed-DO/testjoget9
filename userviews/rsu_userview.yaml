  menus:
  - className: org.joget.apps.userview.lib.DataListMenu
    properties:
      cacheAllLinks: ''
      customHeader: "<script>\r\nfunction hideCheckBoxBasedOnStatut() {\r\n    //\
        \ Get all rows that contain the 'statut_demande' values\r\n    var rows =\
        \ document.querySelectorAll('tbody tr');\r\n    \r\n    rows.forEach(function(row)\
        \ {\r\n        // Get the 'statut_demande' value for the current row from\
        \ the <td> with class \"column_statut_demande\"\r\n        var statut = row.querySelector('.column_body.column_statut_demande').innerText.trim();\r\
        \n        \r\n        // Get the checkbox element in the current row\r\n \
        \       var checkbox = row.querySelector('.select_checkbox input[type=\"checkbox\"\
        ]');\r\n        \r\n        // Condition to hide the checkbox if statut_demande\
        \ is 'En cours de designation'\r\n        console.log('satut',statut);\r\n\
        \            if ((statut != 'A réenquêter')&&(statut !='A enquêter')) {\r\n\
        \            checkbox.disabled  = 'true';  // Hide the checkbox\r\n      \
        \  } else {\r\n            checkbox.style.display = '';  // Ensure checkbox\
        \ is visible if condition is not met\r\n        }\r\n    });\r\n}\r\n\r\n\
        // Call the function initially to hide checkboxes based on the current status\r\
        \n$(document).ready(function(){\r\n    document.querySelector(\"#personnes_incluses_enquete_pmt\
        \ > thead > tr > th.select_checkbox > label > input[type=checkbox]\").disabled='true';\r\
        \n     document.querySelector(\"#personnes_incluses_enquete_pmt > thead >\
        \ tr > th.select_checkbox > label > input[type=checkbox]\").display='none';\r\
        \n    hideCheckBoxBasedOnStatut();\r\n});\r\n\r\n// Add a MutationObserver\
        \ to detect changes in the table and reapply the logic\r\nfunction observeTableChanges()\
        \ {\r\n    var tableBody = document.querySelector('tbody');\r\n\r\n    if\
        \ (tableBody) {\r\n        // Create a MutationObserver instance\r\n     \
        \   var observer = new MutationObserver(function(mutationsList, observer)\
        \ {\r\n            // Reapply the checkbox hiding logic when table body changes\r\
        \n            hideCheckBoxBasedOnStatut();\r\n        });\r\n\r\n        //\
        \ Observe the table body for changes\r\n        observer.observe(tableBody,\
        \ { childList: true, subtree: true });\r\n    }\r\n}\r\n\r\n// Start observing\
        \ changes in the table body\r\nobserveTableChanges();\r\n</script>"
