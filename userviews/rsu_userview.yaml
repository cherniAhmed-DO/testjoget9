        script: "import org.joget.directory.model.service.DirectoryManager;\r\nimport\
          \ org.joget.directory.model.User;\r\nimport org.joget.commons.util.LogUtil;\r\
          \nimport java.util.*;\r\nimport org.joget.apps.app.service.AppUtil;\r\n\
          // Input: Define your filter criteria\r\nString departmentId = \"cellule\"\
          ; // Replace with your department ID\r\n// String departmentIdanps = \"\
          anps\"; // Replace with your department ID\r\nString gradeId = \"responsable\"\
          ;  // Replace with your role ID\r\n// String gradeIdanps = \"responsable\"\
          ;  // Replace with your role ID\r\n\r\n// Output: Store matched users\r\n\
          Collection matchedUsers = new ArrayList();\r\n\r\ntry {\r\n    // Get the\
          \ DirectoryManager instance\r\n    DirectoryManager directoryManager = (DirectoryManager)\
          \ AppUtil.getApplicationContext().getBean(\"directoryManager\");\r\n\r\n\
          \    // Retrieve users based on filters\r\n    Collection users = directoryManager.getUsers(null,\
          \ \"rsu\", departmentId, gradeId, null, null, \"1\", null, false, null,\
          \ null);\r\n    // Collection users2= directoryManager.getUsers(null, \"\
          rsu\", departmentIdanps, gradeIdanps, null, null, \"1\", null, false, null,\
          \ null);\r\n    // Iterate through users and collect usernames\r\n    for\
          \ (Object obj : users) {\r\n        User user = (User) obj;\r\n        matchedUsers.add(user.getUsername());\r\
          \n    }\r\n    // for (Object obj : users2) {\r\n    //     User user =\
          \ (User) obj;\r\n    //     matchedUsers.add(user.getUsername());\r\n  \
          \  // }\r\n    // matchedUsers.add(\"#variable.agent_traitement#\");\r\n\
          return matchedUsers;\r\n    // Log the matched users\r\n    LogUtil.info(\"\
          ProcessMapping\", \"Matched Users: \" + matchedUsers);\r\n\r\n} catch (Exception\
          \ e) {\r\n    LogUtil.error(\"ProcessMapping\", e, e.getMessage());\r\n\
          }\r\n"
